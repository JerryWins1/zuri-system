  // v2.7 (16 Oct): a “Watch: your coach (2 min)” link under the Feedback Studio button.
  // v2.5 (16 Oct): the TEST COACH. ?bw: a big first button "▶ Open Zuri with my coach" (?training&bw&r=&n=) — the steps now show
  //       inside Zuri and this page is the backup and the full list. Cards open one at a time (the clock for a challenge starts
  //       when its card opens). New kinds: 🧠 real-world problems ("scenario": the situation, 💡 Show me how, then "What did you
  //       do?", the good ending and "Did you end the same way?") and the caller's "scenario-call" (what to say, what to check).
  //       After every ✅ a 1–5 ease face; the done row carries the JSON note {v,via:'page',s,ease,hint,self,said}.
  //       The board's Business Week part gains 🔎 How hard is each step (the main output: lowest ease, 🆘 stuck, slow, ❌, missed
  //       screen), 🧪 Is everything tested (features d.feats and screens d.routes, per app version — an older pass = re-check),
  //       🌱 How each tester is doing, and per person per day ⏱ median time, 😊 ease, 💡 hints, 🆘 stuck, 🧠 results.
  //       'auto:' rows (stuck, screen coverage) never count as problems, notes or pay; pay is unchanged.
  // v2.8 (16 Oct): 📣 Alerts in the scripts — callcenter.json 1.3 (cal: an outage alert for Zuri B in two languages, a customer's
  //       language and yes to offers), admin.json 1.3 (aal: approve, WhatsApp groups, the Bulk SMS add-on on and off, FIX to the
  //       same people), field.json 1.3 (fal: 📣 Wired to on a job). The new VERSION refreshes the cached scripts.
  // v2.4 (15 Oct): every Business Week tick records the Zuri app version it was done on ("v2.4 · app v2.35").
  // v2.3 (14 Oct): Business Week moved one day later — Sat 17 → Fri 23 Oct (Kenya). Only the header label changes here; the days,
  //       dates and billing files come from scripts/business_week.json v1.1 (the new VERSION also refreshes the cached JSON).

  let pick = null;
  const C = window.ZURI_CONFIG.training;                                   // the Testers' List always talks to the training copy

  // v2.0: same address as before on the live site; a local copy (tests, previews) links to its own practice.

  const get = (k, d) => { try { const v = localStorage.getItem('zt_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const set = (k, v) => { try { localStorage.setItem('zt_' + k, JSON.stringify(v)); } catch (e) {} };
  let toastT; const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); };
  const $ = (s, r = document) => r.querySelector(s); const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ROLES = { field: '🛠️ Field tech', callcenter: '📞 Call center', finance: '💰 Finance (office)', admin: '⭐ Partner / manager' };
  const SHORT = { field: 'a field tech', callcenter: 'the call center', finance: 'finance', admin: 'a partner' }; // 7 Oct deep check #33
  // v2.1: a one-script link (?script=projects) — its own "me", practising as finance
  const QS = new URLSearchParams(location.search);

  const SCRIPT_ONLY = ONE[QS.get('script')] ? QS.get('script') : null;
  const MEKEY = SCRIPT_ONLY ? 'me_' + SCRIPT_ONLY : 'me';
  let me = get(MEKEY, null);                                               // { name, role, device } (+ script)
  if (SCRIPT_ONLY) {

    if (me) { me.role = ONE[SCRIPT_ONLY].role; me.script = SCRIPT_ONLY; }

  const SID = () => (me && me.script) || (me && me.role);                // which script file / progress this phone runs
  const WHO = () => (me && me.script ? ONE[me.script].label : ROLES[me.role]);
  // v1.5 (6 Oct): every practice link carries the invite code, so a link that opens in another browser
  // (WhatsApp's own browser → Chrome, phone → computer) doesn't stop at the code screen (Emmanuel: "trouble logging in").
  const CODE = () => { try { return (window.ZG && ZG.code()) || ''; } catch (e) { return ''; } };
  const withCode = (q) => (CODE() ? q + '&code=' + encodeURIComponent(CODE()) : q);
  const practice = (role, play) => APP + withCode('?practice&role=' + role + (play ? '&play=' + play : '')) + '#learn';
  const fsLink = (role) => FS + encodeURIComponent(APP + withCode('?practice&role=' + role));

  // ---------- the steps, in order, for one job ----------
  function stepsFor(role) {
    const vid = (id, title, mins, why, vrole) => ({ id: 'v-' + id, sec: 'Watch', t: '▶ ' + title + ' (' + mins + ' min)', why, how: ['Tap the link — practice opens and the video starts by itself (sound on).', 'After it ends, a “Your turn” list appears: do it, then come back here and tap Done.'], links: [['▶ Play it', practice(vrole || role, id)]] });
    const S = [
      vid('howtest', 'How to test Zuri', 2, 'What we need from you, and the three ways to tell us.'),

      vid('day-1', 'A day in the life (5 chapters)', 17, 'One working day through Kelvin, Mary, Peter and the partners. It switches person by itself; just watch.', 'finance'),
      { id: 's-install', sec: 'Get ready', t: '📱 Put Zuri on your phone', why: 'Opened from an icon, Zuri works like an app, even with weak signal.', how: ['Open the practice link below in Chrome.', 'Tap ⋮ (top right) → Add to Home screen → Add.', 'From now on, open Zuri from the icon.'], links: [['🎓 Open practice', APP + withCode('?practice')]] },
      // 7 Oct deep check #33: the link already carries the job, so practice opens as you — no picker to tap.
      { id: 's-pick', sec: 'Get ready', t: '🙂 Open practice as your job', why: 'Practice is pretend customers and pretend money, on your phone only. Nothing you do is real.', how: ['Tap the button below. Practice opens as ' + SHORT[role] + ' straight away.', 'Look around for a minute, then come back here.'], links: [['🎓 Open practice as ' + SHORT[role], practice(role)]] },
    ];
    const mine = { field: ['start', 'tasks', 'field-jobs', 'field-extras'], callcenter: ['start', 'tasks', 'cc-followups', 'cc-newjob', 'customers'], finance: ['start', 'tasks', 'fin-daily', 'fin-bills', 'fin-statements'], admin: ['start', 'tasks', 'partners', 'admin', 'fin-daily', 'fin-bills'] }[role];
    const NAMES = { start: ['Welcome to Zuri', 2, null], tasks: ['Your task list', 2, 'field'], 'field-jobs': ['Doing a job, start to finish', 3, 'field'], 'field-extras': ['Photos, parts, map pins, new jobs', 3, 'field'], 'cc-followups': ['Payment follow-up calls', 3, 'callcenter'], 'cc-newjob': ['A customer calls with a problem', 2, 'callcenter'], customers: ['Finding a customer', 2, 'callcenter'], 'fin-daily': ['Daily money: count, record, check', 3, 'finance'], 'fin-bills': ['Paying the monthly bills', 2, 'finance'], 'fin-statements': ['Bank & M-Pesa statements', 3, 'finance'], partners: ['Running the company from Home', 3, 'admin'], admin: ['Adding a new staff member', 2, 'admin'] };
    mine.forEach((id) => { const [t, m, r] = NAMES[id]; S.push(vid(id, t, m, 'The video for your job. Watch, then do the Your-turn list.', r || role)); });
    // the checklist lines for this job, from the same list the app uses
    const groups = (window.ZURI_CHECKLIST || []).filter((g) => g.roles.includes(role === 'finance' ? 'internal' : role) && (!g.dept || role === 'finance' || role === 'admin'));
    groups.forEach((g) => g.items.forEach((i) => S.push({ id: 'c-' + i.id, sec: 'Try it yourself', t: '🧪 ' + i.t, why: g.label + '. Do it in practice, then tick it. If anything was confusing, slow or wrong, write it in the box below.', how: [i.how], links: [['🎓 Open practice', practice(role)]].concat(i.lesson ? [['▶ Show me', practice(role === 'finance' && /fin|partners|admin/.test(i.lesson) ? (/partners|admin/.test(i.lesson) ? 'admin' : 'finance') : role, i.lesson)]] : []) })));
    S.push(
      { id: 's-signup', sec: 'Join the training copy', t: '🟠 Make your account on the TRAINING copy', why: 'Training is a real shared system on pretend data: what you do, your teammates see. This is where you work like a real day.', how: ['Open the training link. Tap Create my account.', 'Your name, your phone number, your email, a password. Tap Create account.', 'Open the email we send and tap the link.'], links: [['🟠 Open the training copy', APP + withCode('?training')]] },
      { id: 's-tell', sec: 'Join the training copy', t: '🙋 Tell Jerry “signed up”', why: 'A partner switches your account on and gives you your job. Until then the app says “Almost there”.', how: ['WhatsApp Jerry: “signed up”.', 'When he says done, open the training copy and sign in.'], links: [] },
      { id: 's-realday', sec: 'Join the training copy', t: '📅 Do one real day on the training copy', why: 'Jobs, calls, counts and payments — the way you would on a real day. Your teammates will see them.', how: ['Do your normal work in the training copy for one day.', 'Note anything that slowed you down.'], links: [['🟠 Open the training copy', APP + withCode('?training')]] },
      { id: 's-fs', sec: 'Tell us', t: '🎙 Talk through one session in Feedback Studio', why: 'Talking while you use it is the best report there is. Point at anything wrong.', how: ['Open the link: Zuri on top, the red button underneath.', 'Press the red button and say what you think as you tap around. 👆 Point, then tap the thing that is wrong.', '✅ I\'m done → 📨 Send to Claude → send it to Jerry.'], links: [['🎙 Open Zuri in Feedback Studio', fsLink(role)]] },
      { id: 's-three', sec: 'Tell us', t: '✍️ Write the three most confusing things', why: 'Even three words each helps. Write them in the box below and tap Send to Claude.', how: ['What confused you most?', 'What was slow?', 'What would you change first?'], links: [] },
    );
    return S;
  }

  // ---------- saving: on the phone, and up to the training copy ----------
  const device = get('device', null) || (() => { const d = 'd' + Math.random().toString(36).slice(2, 10); set('device', d); return d; })();
  let state = get('state', {});                                             // stepId → 'done' | 'skip'
  async function log(kind, step, note) {
    if (!me) return;
    const row = { tester: me.name, role: me.role, device, step, kind, note: note || null, version: VERSION };
    try { const { error } = await sb.from('tester_log').insert(row); if (error) throw error; return true; }
    catch (e) { const q = get('queue', []); q.push(row); set('queue', q); return false; }
  }
  async function flush() { const q = get('queue', []); if (!q.length) return; const { error } = await sb.from('tester_log').insert(q); if (!error) set('queue', []); }
  window.addEventListener('online', flush);

  // ---------- the plan: what the partners asked this tester to test ----------
  let plan = null;                                                        // { steps: [...ids] | [], focus }
  async function loadPlan() {
    try {
      const { data } = await sb.from('tester_plan').select('*').order('at', { ascending: false }).limit(200);
      const rows = data || [];
      plan = rows.find((r) => r.tester.trim().toLowerCase() === me.name.trim().toLowerCase())
          || rows.find((r) => r.tester === '*' && (!r.role || r.role === me.role)) || null;
      set('plan', plan);
    } catch (e) { plan = get('plan', null); }
  }
  function planned(steps) {
    if (!plan || !Array.isArray(plan.steps) || !plan.steps.length) return steps;
    return steps.filter((s) => plan.steps.includes(s.id));
  }

  // ======================================================================================================
  // ---------- v2.0 · the TEST SCRIPT: numbered steps, Do this / You should see, ✅ ❌ 🤷 ----------
  // ======================================================================================================
  const SX = { script: null, role: null, loaded: false, reward: { kes_per_script: 500, kes_per_problem: 50, weekly_cap: 1500 }, confirmed: [], serverOk: null };
  const REWARD_DEFAULT = { kes_per_script: 500, kes_per_problem: 50, weekly_cap: 1500 };
  const FINISH_DAYS = 7, RUSH_SECS = 6;
  const pad2 = (n) => String(n).padStart(2, '0');
  const ymdL = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  // {dmy} {day} {tomorrow} in a step become today's real values, so the example M-Pesa message and pay day always fit.
  const tokens = (s) => { const d = new Date(), t = new Date(Date.now() + 864e5); return String(s || '').replace(/\{dmy\}/g, pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2)).replace(/\{day\}/g, String(d.getDate())).replace(/\{today\}/g, ymdL(d)).replace(/\{tomorrow\}/g, ymdL(t)); };
  const fmtDay = (t) => new Date(t).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtWhen = (t) => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const mmss = (s) => Math.floor(s / 60) + ':' + pad2(Math.floor(s % 60));
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  const ANS = { ok: ['✅', 'It worked'], fail: ['❌', "It didn't"], unsure: ['🤷', 'Not sure'] };
  // The steps that count: pending sessions (e.g. Receipts, until it is switched on) are left out everywhere.
  const liveSessions = (sc) => (sc ? sc.sessions.filter((s) => !s.pending) : []);
  const liveSteps = (sc) => liveSessions(sc).flatMap((s) => s.steps.map((st) => ({ ...st, sid: s.id })));
  const coinValue = (sc, rw) => { const n = liveSteps(sc).length + 10; return n ? Math.round((rw || SX.reward).kes_per_script / n) : 0; };
  const isMissing = (err) => !!err && (err.code === 'PGRST205' || err.code === '42P01' || /does not exist|could not find the table|schema cache/i.test(err.message || ''));

  async function loadScript(role) {
    const key = 'sx_script_' + role;
    try {
      const r = await fetch('scripts/' + role + '.json?v=' + encodeURIComponent(VERSION.split(' ')[0]), { cache: 'no-cache' });
      if (!r.ok) throw new Error('script ' + r.status);
      const sc = await r.json();
      if (!sc || !Array.isArray(sc.sessions)) throw new Error('bad script');
      set(key, sc); return sc;
    } catch (e) { return get(key, null); }                                  // offline: the copy this phone saw last time
  }
  // One phone, one job: everything about this tester's run of the script.
  const sxKey = () => 'sx_' + SID();
  const sxState = () => get(sxKey(), { answers: {}, cur: null, sessSecs: {}, first: null, last: null, reported: null });
  const sxSave = (st) => set(sxKey(), st);

  async function loadRewards() {
    try {
      const { data, error } = await sb.from('test_reward_settings').select('*').order('at', { ascending: false }).limit(1);
      if (error) throw error;
      if (data && data[0]) SX.reward = { kes_per_script: data[0].kes_per_script, kes_per_problem: data[0].kes_per_problem, weekly_cap: data[0].weekly_cap };
      set('sx_reward', SX.reward);
    } catch (e) { SX.reward = get('sx_reward', REWARD_DEFAULT); }
    try {
      const { data, error } = await sb.from('test_confirmed').select('*').order('at', { ascending: false }).limit(1000);
      if (error) throw error;
      const latest = {};
      (data || []).filter((r) => r.tester.trim().toLowerCase() === me.name.trim().toLowerCase() && r.role === me.role).forEach((r) => { if (!latest[r.step]) latest[r.step] = r; });
      SX.confirmed = Object.values(latest).filter((r) => r.status === 'confirmed').map((r) => r.step);
      set('sx_confirmed', SX.confirmed);
    } catch (e) { SX.confirmed = get('sx_confirmed', []); }
  }
  function myCoins(st) {
    const live = liveSteps(SX.script);
    const answered = live.filter((s) => st.answers[s.id]).length;
    const confirmed = SX.confirmed.filter((id) => st.answers[id] && ['fail', 'unsure'].includes(st.answers[id].a)).length;
    const coins = answered + 5 * confirmed + (st.reported ? 10 : 0);
    const kes = st.reported ? SX.reward.kes_per_script + confirmed * SX.reward.kes_per_problem : Math.round(answered * coinValue(SX.script)) + confirmed * SX.reward.kes_per_problem;
    return { coins, kes, answered, total: live.length, confirmed };
  }
  const finishBy = (st) => (st.first ? new Date(new Date(st.first).getTime() + FINISH_DAYS * 864e5) : null);

  // ---------- sending answers: on the phone first, then up to the training copy ----------
  async function sxFlush() {
    const q = get('sxq', []); if (!q.length || !navigator.onLine) return;

  }

  }
  window.addEventListener('online', sxFlush);

  // A photo from the phone's library, made small enough to send on weak signal (max 900 px, JPEG).
  function shrink(file) {
    return new Promise((ok) => {
      const fr = new FileReader();
      fr.onload = () => { const img = new Image(); img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); let q = 0.6, u = c.toDataURL('image/jpeg', q); while (u.length > 380000 && q > 0.2) { q -= 0.15; u = c.toDataURL('image/jpeg', q); } ok(u);
      }; img.onerror = () => ok(null); img.src = fr.result; };
      fr.onerror = () => ok(null); fr.readAsDataURL(file);
    });
  }

  // ---------- the session timer: counts only while the script is on screen ----------
  let tick = null, tickFrom = 0, tickSid = null;
  function timerStop() {
    if (tickSid && tickFrom) { const st = sxState(); st.sessSecs[tickSid] = (st.sessSecs[tickSid] || 0) + (Date.now() - tickFrom) / 1000; sxSave(st); }
    clearInterval(tick); tick = null; tickFrom = 0; tickSid = null;
  }
  function timerStart(sid, target) {
    timerStop(); tickSid = sid; tickFrom = Date.now(); SX.target = target;
    const paint = () => { const el = $('#sx-timer'); if (!el) return; const st = sxState(); const s = (st.sessSecs[sid] || 0) + (Date.now() - tickFrom) / 1000;
      el.textContent = '⏱ ' + mmss(s) + ' of ~' + target + ' min'; el.classList.toggle('over', s > target * 60);
      el.title = s > target * 60 ? 'Over the guide time — no rush, finish carefully.' : 'A guide, not a limit.'; };
    paint(); tick = setInterval(() => { if (document.hidden) return; paint(); }, 1000);
  }
  // Phone locked or another tab (practice) in front: the clock pauses, and carries on when the tester comes back.
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (tickSid) { SX.paused = [tickSid, SX.target]; timerStop(); } } else if (SX.paused) { const [sid, tg] = SX.paused; SX.paused = null; if ($('#sx-timer')) timerStart(sid, tg); } });
  const sessSecsNow = (sid) => { const st = sxState(); return Math.round((st.sessSecs[sid] || 0) + (tickSid === sid && tickFrom ? (Date.now() - tickFrom) / 1000 : 0)); };

  // ---------- the script on the main list: one card at the top ----------
  function sxCard() {
    if (!SX.script) return '';
    const st = sxState(); const c = myCoins(st); const live = liveSteps(SX.script);
    const fb = finishBy(st); const late = fb && !st.reported && Date.now() > fb.getTime();
    const next = live.find((s) => !st.answers[s.id]);
    const sess = next ? liveSessions(SX.script).findIndex((s) => s.id === next.sid) : -1;
    return `<div class="sx" id="sx-card"><div class="lbl"><span>📝 Your test script</span><span>${c.answered} / ${c.total}</span></div>
      <h2 style="margin-bottom:6px">${st.reported ? 'Finished and sent — asante sana!' : c.answered ? 'Carry on where you stopped' : 'Test Zuri step by step'}</h2>
      <div style="color:var(--soft);font-size:14.5px;margin-bottom:8px">${st.reported ? 'Your report reached Jerry.' : next ? `Next: session ${sess + 1} of ${liveSessions(SX.script).length}, step ${live.filter((s) => s.sid === next.sid).indexOf(next) + 1} — about ${liveSessions(SX.script)[sess].mins} minutes a session.` : 'Every step answered — send your report.'}</div>
      <div class="chips"><span class="chip coin">🪙 ${c.coins} coins ≈ KES ${c.kes.toLocaleString('en-GB')}</span>${fb ? `<span class="chip ${late ? 'late' : ''}">${late ? '⏰ Overdue — was due ' : '📅 Finish by '}${fmtDay(fb)}</span>` : `<span class="chip">📅 ${FINISH_DAYS} days from your first step</span>`}</div>
      <div class="bar"><i style="width:${Math.round((c.answered / Math.max(1, c.total)) * 100)}%"></i></div>
      <button class="big" id="sx-go">${st.reported ? '📝 See my answers' : c.answered ? '▶ Continue my test script' : '▶ Start my test script'}</button>
      <p style="font-size:12.5px;color:var(--faint);margin:8px 0 0">Finish it and send the report: KES ${SX.reward.kes_per_script.toLocaleString('en-GB')}. Each real problem you find: +KES ${SX.reward.kes_per_problem}.</p></div>`;
  }

  // ---------- the player: one step at a time ----------
  let sxPick = null;                                                       // a step the tester went back to
  function sxOrder() { return liveSteps(SX.script); }
  function sxCurrent(st) {
    const all = sxOrder();
    if (sxPick && all.some((s) => s.id === sxPick)) return all.find((s) => s.id === sxPick);
    return all.find((s) => !st.answers[s.id]) || null;
  }
  const canOpen = (st, id) => { const all = sxOrder(); const i = all.findIndex((s) => s.id === id); const firstOpen = all.findIndex((s) => !st.answers[s.id]); return i >= 0 && (firstOpen < 0 || i <= firstOpen); };

  function sxPlay() {
    set('view', 'script');
    const st = sxState(); const all = sxOrder(); const cur = sxCurrent(st);
    $('#prog').hidden = false; $('#prog').textContent = `${all.filter((s) => st.answers[s.id]).length} / ${all.length}`;
    $('#sub').textContent = `${me.name} · ${WHO()} · test script`;

  // ❌ / 🤷 → "What happened?" (type, talk with the keyboard's 🎤, or add a screenshot from the photo library)

    $$('.ans button').forEach((b) => { b.classList.toggle('on', b.dataset.a === kind); b.setAttribute('aria-pressed', b.dataset.a === kind); });

      <textarea id="sx-note" aria-label="What happened?" placeholder="${kind === 'fail' ? 'e.g. I tapped Save and nothing happened' : 'e.g. I could not find the Pay button'}">${esc(prev && prev.a === kind ? prev.note || '' : '')}</textarea>

    $('#sx-file').onchange = async (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; toast('Adding the screenshot…'); shot = await shrink(f); $('#sx-shotbox').innerHTML = shot ? `<img src="${esc(shot)}" alt="Your screenshot">` : '<span class="hint">That picture could not be read — try another.</span>'; };

  function sxAnswer(step, kind, note, shot) {
    const st = sxState(); const now = Date.now();
    const prevAt = st.last; const first = !st.answers[step.id];
    const secs = prevAt ? Math.round((now - prevAt) / 1000) : null;
    st.answers[step.id] = { a: kind, note: note || '', shot: shot || null, at: new Date(now).toISOString(), secs };
    if (!st.first) st.first = new Date(now).toISOString();
    st.last = now; sxSave(st);
    const sess = liveSessions(SX.script).find((s) => s.steps.some((x) => x.id === step.id));
    sxQueue({ id: uuid(), tester: me.name, role: me.role, device, script_version: ((me.script ? me.script + '-' : '') + String(SX.script.version || '')).slice(0, 20), session: sess.id, step: step.id, answer: kind,
      note: note ? note.slice(0, 1000) : null, shot: shot || null, secs: secs == null ? null : Math.min(secs, 864000), session_secs: Math.min(sessSecsNow(sess.id), 864000), client_at: new Date(now).toISOString() });
    // ❌ and 🤷 notes also go where notes always went, so the old board, Daraja HQ and "read the testers' list" see them today.
    if (kind !== 'ok') log('note', ('sx:' + step.id).slice(0, 60), (ANS[kind][0] + ' ' + tokens(step.do).slice(0, 120) + ' — ' + (note || '(no words)') + (shot ? ' [screenshot on the board]' : '')).slice(0, 1000));
    if (first) toast(kind === 'ok' ? '✅ +1 coin' : 'Saved — thank you! +1 coin'); else toast('Answer changed.');
    sxPick = null; sxPlay(); window.scrollTo(0, 0);
  }

  // ---------- finished: the report ----------
  function sxSummary(st) {
    const live = liveSteps(SX.script); const n = (k) => live.filter((s) => st.answers[s.id] && st.answers[s.id].a === k).length;
    const mins = Math.round(Object.values(st.sessSecs || {}).reduce((t, x) => t + x, 0) / 60);
    let s = `📝 Test script report — ${WHO()} (script ${SX.script.version}) · ${me.name}\n${live.length} steps: ${n('ok')} ✅ · ${n('fail')} ❌ · ${n('unsure')} 🤷 · about ${mins} min`;
    live.filter((x) => st.answers[x.id] && st.answers[x.id].a !== 'ok').forEach((x) => { const a = st.answers[x.id]; s += `\n${ANS[a.a][0]} ${x.id} ${tokens(x.do).slice(0, 60)}… — ${a.note || '(no words)'}`; });
    return s.slice(0, 1000);
  }
  function sxFinish() {

  // like log(), but says whether the database refused the row (so the report can fall back to a note)
  async function logRow(kind, step, note) {
    const row = { tester: me.name, role: me.role, device, step, kind, note: note || null, version: VERSION };
    try { const { error } = await sb.from('tester_log').insert(row); if (error) { if (/check constraint|23514/i.test(error.message + (error.code || ''))) return 'rejected'; throw error; } return true; }
    catch (e) { const q = get('queue', []); q.push(row.kind === 'report' ? { ...row, kind: 'note', step: ('script:report:' + me.role).slice(0, 60) } : row); set('queue', q); return false; }
  }

  // ---------- v2.0 · the board's test-script part: coverage grid, testers, nudges, rewards, payments ----------
  async function boardScripts(ok, log) {
    const sc = {};
    await Promise.all(Object.keys(ROLES).map(async (r) => { sc[r] = await loadScript(r); }));
    const q = async (t, fn) => { try { const r = await fn(ok.a.from(t)); if (r.error) return { missing: isMissing(r.error), err: r.error, data: [] }; return { data: r.data || [] }; } catch (e) { return { err: e, data: [] }; } };
    const [A, RS, CF, PY, PH, PR] = await Promise.all([
      q('script_answers', (t) => t.select('*').order('client_at', { ascending: true }).limit(10000)),
      q('test_reward_settings', (t) => t.select('*').order('at', { ascending: false }).limit(1)),
      q('test_confirmed', (t) => t.select('*').order('at', { ascending: false }).limit(5000)),
      q('test_payments', (t) => t.select('*').order('at', { ascending: false }).limit(5000)),
      q('tester_phones', (t) => t.select('*').order('at', { ascending: false }).limit(1000)),
      q('profiles', (t) => t.select('full_name,phone')),
    ]);
    const missing = [A, RS, CF, PY, PH].some((x) => x.missing);
    const rw = (RS.data[0] && { kes_per_script: RS.data[0].kes_per_script, kes_per_problem: RS.data[0].kes_per_problem, weekly_cap: RS.data[0].weekly_cap }) || REWARD_DEFAULT;
    const low = (s) => String(s || '').trim().toLowerCase();
    const who = (n, r) => low(n) + '|' + r;
    const T = {};                                                             // tester key → everything about them
    const tester = (name, role) => (T[who(name, role)] = T[who(name, role)] || { name, role, rows: [], latest: {}, last: 0, logLast: 0, report: null });
    A.data.forEach((r) => { if (!ROLES[r.role]) return; const t = tester(r.tester, r.role); t.rows.push(r); const c = t.latest[r.step]; if (!c || c.client_at <= r.client_at) t.latest[r.step] = r; t.last = Math.max(t.last, Date.parse(r.client_at)); });
    log.forEach((r) => { if (!ROLES[r.role] || String(r.step).startsWith('auto:') || String(r.step).startsWith('bw:')) return; const t = tester(r.tester, r.role); t.logLast = Math.max(t.logLast, Date.parse(r.at));
      if ((r.kind === 'report' || (r.kind === 'note' && String(r.step).startsWith('script:report:'))) && (!t.report || t.report.at < r.at)) t.report = r; });
    const conf = {}; CF.data.forEach((r) => { const k = who(r.tester, r.role) + '|' + r.step; if (!conf[k]) conf[k] = r; });  // newest first
    const phones = {}; PH.data.forEach((r) => { if (!phones[low(r.tester)]) phones[low(r.tester)] = r.phone; });
    const profPhone = (name) => { const ps = PR.data.filter((p) => p.phone); const ex = ps.find((p) => low(p.full_name) === low(name)); if (ex) return ex.phone; const f = low(name).split(' ')[0]; const m = ps.filter((p) => low(p.full_name).split(' ')[0] === f); return m.length === 1 ? m[0].phone : null; };
    const weekKey = (t) => { const d = new Date(Date.parse(t) + 3 * 3600e3); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day); return d.toISOString().slice(0, 10); };
    const now = Date.now();
    const list = Object.values(T).map((t) => {
      const s = sc[t.role]; const live = liveSteps(s); const ids = new Set(live.map((x) => x.id));
      const lat = Object.values(t.latest).filter((r) => ids.has(r.step));
      const done = lat.length; const first = t.rows.length ? Math.min(...t.rows.map((r) => Date.parse(r.client_at))) : null;
      const finished = !!t.report && done === live.length && live.length > 0;
      const reds = lat.filter((r) => r.answer !== 'ok').map((r) => ({ ...r, conf: conf[who(t.name, t.role) + '|' + r.step] || null }));
      const confirmed = reds.filter((r) => r.conf && r.conf.status === 'confirmed');
      const sess = liveSessions(s).map((ss) => { const rs = t.rows.filter((r) => r.session === ss.id); const secs = rs.length ? Math.max(...rs.map((r) => r.session_secs || 0)) : 0; const n = ss.steps.filter((x) => t.latest[x.id]).length;
        return { id: ss.id, title: ss.title, mins: ss.mins, secs, n, total: ss.steps.length, under: n === ss.steps.length && secs < ss.mins * 60 * 0.35 }; });
      const rush = t.rows.filter((r) => r.secs != null && r.secs < RUSH_SECS).length;
      const items = (finished ? [{ at: t.report.at, kes: rw.kes_per_script }] : []).concat(confirmed.map((r) => ({ at: r.conf.at, kes: rw.kes_per_problem })));
      const weeks = {}; items.forEach((i) => { const k = weekKey(i.at); weeks[k] = (weeks[k] || 0) + i.kes; });
      const earned = Object.values(weeks).reduce((a, v) => a + Math.min(v, rw.weekly_cap), 0);
      const capped = Object.values(weeks).some((v) => v > rw.weekly_cap);
      const pays = PY.data.filter((p) => low(p.tester) === low(t.name) && (!p.role || p.role === t.role));
      const paid = pays.reduce((a, p) => a + Number(p.amount || 0), 0);
      const last = Math.max(t.last, t.logLast) || null;
      const fby = first ? first + FINISH_DAYS * 864e5 : null;
      const stop = live.find((x) => !t.latest[x.id]);
      return { ...t, live, done, first, finished, reds, confirmed, sess, rush, earned, capped, paid, owed: Math.max(0, earned - paid), pays, last, fby, overdue: fby && !finished && now > fby, stop,
        coins: done + 5 * confirmed.length + (finished ? 10 : 0), phone: phones[low(t.name)] || profPhone(t.name), phoneFrom: phones[low(t.name)] ? 'board' : 'account',
        nudge: !finished && last && now - last >= 2 * 864e5 };
    }).sort((a, b) => a.role.localeCompare(b.role) || a.name.localeCompare(b.name));

    // ── the coverage grid, one per job ──
    const grid = (role) => {
      const s = sc[role]; if (!s) return `<div class="card">No script for ${ROLES[role]} (testers/scripts/${role}.json didn't load).</div>`;

        ${ts.length ? `<div class="scroll-x"><table class="grid"><tr><th></th>${ts.map((t) => `<th title="${esc(t.name)}">${esc(t.name.split(' ')[0].slice(0, 8))}</th>`).join('')}</tr>
          ${live.map((x) => `<tr><td class="s" title="${esc(tokens(x.do))}">${passed.includes(x) ? '✅' : '⬜'} ${esc(x.id)} ${esc(tokens(x.do).slice(0, 26))}</td>${ts.map((t) => { const a = t.latest[x.id]; return `<td class="c ${a ? a.answer : 'none'}" data-cell="${esc(t.name)}|${esc(x.id)}" data-tip="${esc(t.name + ' · ' + x.id + ': ' + (a ? ANS[a.answer][1] + (a.note ? ' — ' + a.note : '') : 'not answered yet'))}">${a ? { ok: '✓', fail: '✗', unsure: '?' }[a.answer] : ''}</td>`; }).join('')}</tr>`).join('')}</table></div>` : '<div style="color:var(--faint)">Nobody in this job has started the script yet.</div>'}</div>`;
    };
    // ── the nudge: a WhatsApp message with the text written, which Jerry sends himself ──
    const testersLink = 'https://jerrywins1.github.io/zuri-system/testers/';
    const nudgeText = (t) => { const s = sc[t.role]; const ss = t.stop ? liveSessions(s).find((x) => x.id === t.stop.sid) : null; const si = ss ? liveSessions(s).indexOf(ss) + 1 : 0; const k = ss ? ss.steps.findIndex((x) => x.id === t.stop.id) + 1 : 0;
      return `Habari ${t.name.split(' ')[0]}! 👋 Your Zuri test script is waiting.` + (t.rows.length && t.stop ? ` You stopped at session ${si}, step ${k}: “${tokens(t.stop.do).slice(0, 90)}${tokens(t.stop.do).length > 90 ? '…' : ''}” — about ${ss.mins} minutes to finish that session.` : ' It starts with 20 minutes of easy steps in practice.')
        + ` Open it here: ${testersLink}` + (t.fby ? ` Please finish by ${fmtDay(t.fby)}.` : '') + ` Finishing earns KES ${rw.kes_per_script}, and each real problem you find +KES ${rw.kes_per_problem}. Asante! — Jerry`; };
    const waNum = (p) => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '254' + d.slice(1); else if (d.length === 9) d = '254' + d; return d; };
    const waLink = (t) => 'https://wa.me/' + (t.phone ? waNum(t.phone) : '') + '?text=' + encodeURIComponent(nudgeText(t));
    const nudges = list.filter((t) => t.nudge);
    const ago = (ms) => { const d = Math.floor((now - ms) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
    const kes = (n) => 'KES ' + Number(n || 0).toLocaleString('en-GB');
    const today = ymdL(new Date());

    const card = (t) => `<div class="tcard" data-t="${esc(who(t.name, t.role))}">
      <h4>${esc(t.name)} <span style="font-weight:600;color:var(--faint);font-size:13px">${ROLES[t.role]}</span></h4>
      <div>${t.finished ? '<span class="flag ok">✅ Finished · report sent</span>' : t.report ? '<span class="flag amber">Report sent, steps missing</span>' : ''}${t.overdue ? `<span class="flag">⏰ Overdue — was due ${fmtDay(t.fby)}</span>` : ''}${t.rush ? `<span class="flag amber">⚡ ${t.rush} answer${t.rush > 1 ? 's' : ''} under ${RUSH_SECS} s apart</span>` : ''}${t.sess.filter((x) => x.under).map((x) => `<span class="flag amber">🏃 ${esc(x.title)}: ${mmss(x.secs)} of ~${x.mins} min</span>`).join('')}${t.nudge ? '<span class="flag">💤 needs a nudge</span>' : ''}</div>
      <div class="kv" style="margin-top:6px"><b>Last active</b><span>${t.last ? fmtWhen(t.last) + ' (' + ago(t.last) + ')' : '—'}</span>

        <b>Finish by</b><span>${t.fby ? fmtDay(t.fby) : 'starts with their first step'}</span>
        <b>Time</b><span>${t.sess.map((x) => `${esc(x.id)} ${mmss(x.secs)} / ${x.mins} min (${x.n}/${x.total})`).join(' · ')}</span>
        <b>Coins</b><span>🪙 ${t.coins}</span>
        <b>KES</b><span>earned ${kes(t.earned)}${t.capped ? ' (weekly cap)' : ''} · paid ${kes(t.paid)} · <b style="color:var(--ink)">owed ${kes(t.owed)}</b></span></div>

        ${t.finished ? '' : `<a class="mini go" data-nudge href="${esc(waLink(t))}" target="_blank" rel="noopener" style="margin-top:6px">💬 WhatsApp nudge (you send it)</a>`}</div>

        <button class="mini go" data-pay>Record the payment</button><span style="font-size:12px;color:var(--faint)"> Records only — send the money in M-Pesa first.</span>
        ${t.pays.map((p) => `<div style="font-size:13px;margin-top:4px">✔ ${kes(p.amount)} · ${esc(p.mpesa_code || 'no code')} · ${esc(p.paid_on)} · by ${esc(p.by_who || '?')}</div>`).join('')}</details></div>`;

    const coinRows = Object.keys(ROLES).filter((r) => sc[r]).map((r) => `${ROLES[r]}: ${liveSteps(sc[r]).length} steps + 10 = ${liveSteps(sc[r]).length + 10} coins → 1 coin ≈ <b data-coin="${r}">KES ${coinValue(sc[r], rw)}</b>`).join('<br>');

  const vCmp = (a, b) => { const x = vNum(a), y = vNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };
  const median = (a) => { const b = a.filter((x) => Number.isFinite(x)).sort((x, y) => x - y); if (!b.length) return null; const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };

        h.hints ? `<span class="flag amber">💡 ${h.hints} hint${h.hints === 1 ? '' : 's'}</span>` : '', (h.self.yes + h.self.partly + h.self.no) ? `<span class="flag ${h.self.no ? '' : h.self.partly ? 'amber' : 'ok'}">🧠 ${h.self.yes}✓ ${h.self.partly}〰 ${h.self.no}✖</span>` : ''].join('');
      return `<li><details><summary><span class="hn">${i + 1}</span><span class="ht"><b>${esc(c.t)}</b><span class="hm">Day ${c.n} · ${esc((RL[c.role] || {}).short || c.role)} · ${esc(c.at || '')}${c.route ? ' · 📍 ' + esc(c.route) : ''} · ${h.done} done</span><span class="hc">${chips}</span></span></summary>
        <div class="hd">${h.who.map((w) => `<div><b>${esc(w.name)}</b> ${w.prob != null ? `❌ ${esc(w.prob)}` : w.stuck != null ? `🆘 stuck <span style="color:var(--faint)">${esc(w.stuck || '')}</span>` : `${w.ease != null ? '😊 ' + w.ease : ''} ${w.s != null ? '⏱ ' + fmtS(w.s) : ''} ${w.hit === 0 ? '🧭 not on the screen' : ''} ${w.self ? SELFT[w.self] || '' : ''}${w.said ? ` — “${esc(w.said)}”` : ''}${w.app ? ` <span style="color:var(--faint)">· app ${esc(w.app)}</span>` : ''}`}</div>`).join('')}
          ${c.end ? `<div style="color:var(--faint);margin-top:4px">Expected: ${esc(c.end)}</div>` : ''}</div></details></li>`; };
    const hardList = (key, all) => { const s = hard.slice().sort(HSORT[key][1]); return (all ? s : s.slice(0, 12)).map(hardRow).join('') || '<li style="list-style:none;color:var(--faint)">No measures yet — they come in as testers tick ✅ (in Zuri with the coach, or on their page) and rate how easy it was.</li>'; };

    // ---- v2.5 · 🧪 Is everything tested (features × app version, screens visited) ----
    const curApp = (await appVersion()) || Object.values(P).flatMap((p) => Object.values(p.doneRow).map((x) => x.app)).filter(Boolean).sort(vCmp).pop() || null;
    const feats = featList(bw.feats);
    const fv = {};                                                                           // feature tag → Set of app versions it passed on
    list.forEach((p) => p.drAll.forEach((x) => { const c = CH[x._cid]; asLines(c && c.feat).forEach((t) => { (fv[t] = fv[t] || new Set()).add(x.app || '?'); }); }));
    const fStat = feats.map((f) => { const vs = fv[f.tag] ? [...fv[f.tag]] : []; const known = vs.filter((v) => v !== '?').sort(vCmp);
      return { ...f, vs, st: curApp && vs.includes(curApp) ? 'ok' : vs.length ? 'old' : 'never', last: known.pop() || (vs.length ? 'an unknown version' : null) }; });
    const rv = {};                                                                           // route → Set of app versions it was seen on
    const addR = (r, v) => { r = normRoute(r); if (!r) return; (rv[r] = rv[r] || new Set()).add(v || '?'); };
    autos.filter((r) => r.step === 'auto:cover').forEach((r) => { const s = String(r.note || ''); const i = s.indexOf('|'); const v = appOf(i >= 0 ? s.slice(0, i) : '') || appOf(r.version); (i >= 0 ? s.slice(i + 1) : s).split(',').forEach((x) => addR(x, v)); });
    list.forEach((p) => p.drAll.forEach((x) => { const pp = x.j && typeof x.j.p === 'string' ? x.j.p : ''; pp.split('>').forEach((y) => addR(y, x.app)); }));
    const routes = Array.isArray(bw.routes) ? [...new Set(bw.routes.map(normRoute).filter(Boolean))] : [];
    const seenOn = (R) => { const out = new Set(); Object.entries(rv).forEach(([r, vs]) => { if (r === R || (!R.includes(':') && r.startsWith(R + '/'))) vs.forEach((v) => out.add(v)); }); return [...out]; };
    const rStat = routes.map((R) => { const vs = seenOn(R); const known = vs.filter((v) => v !== '?').sort(vCmp); return { tag: R, vs, st: curApp && vs.includes(curApp) ? 'ok' : vs.length ? 'old' : 'never', last: known.pop() || (vs.length ? 'an unknown version' : null) }; });
    const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
    const covBlock = (title, items, nameOf) => { if (!items.length) return ''; const k = { ok: 0, old: 0, never: 0 }; items.forEach((x) => k[x.st]++);
      return `<div class="cov"><div class="covh"><b>${title}</b><span><b>${pct(k.ok, items.length)}%</b> on app ${esc(curApp || '?')} · ${k.ok} of ${items.length}</span></div>
        <div class="stack" role="img" aria-label="${k.ok} tested on the current app, ${k.old} only on older versions, ${k.never} never"><i class="ok" style="width:${pct(k.ok, items.length)}%"></i><i class="old" style="width:${pct(k.old, items.length)}%"></i></div>
        <div class="covk"><span><i class="ok"></i>${k.ok} tested on ${esc(curApp || 'this app')}</span><span><i class="old"></i>${k.old} need a re-check</span><span><i></i>${k.never} never</span></div>
        ${k.never ? `<details><summary>⬜ Never tested (${k.never})</summary><div class="tags">${items.filter((x) => x.st === 'never').map((x) => `<span class="pill" title="${esc(x.tag)}">${esc(nameOf(x))}</span>`).join('')}</div></details>` : ''}
        ${k.old ? `<details><summary>🔁 Needs re-check on ${esc(curApp || 'the new app')} (${k.old})</summary><div class="tags">${items.filter((x) => x.st === 'old').map((x) => `<span class="pill" title="last passed on ${esc(x.last)}">${esc(nameOf(x))} · <small>${esc(x.last)}</small></span>`).join('')}</div></details>` : ''}</div>`; };
    const byVer = {}; list.forEach((p) => p.drAll.forEach((x) => { const v = x.app || '?'; const b = (byVer[v] = byVer[v] || { ticks: 0, feats: new Set(), people: new Set() }); b.ticks++; b.people.add(p.name); asLines(CH[x._cid] && CH[x._cid].feat).forEach((t) => b.feats.add(t)); }));
    Object.entries(rv).forEach(([, vs]) => vs.forEach((v) => (byVer[v] = byVer[v] || { ticks: 0, feats: new Set(), people: new Set() })));
    const verRows = Object.keys(byVer).sort((a, b) => (a === '?' ? 1 : b === '?' ? -1 : vCmp(b, a)));
    const covHtml = feats.length || routes.length ? `<h3><span>🧪 Is everything tested</span><span>app ${esc(curApp || '?')}</span></h3>
      <div class="card">${covBlock('Features', fStat, (x) => x.name)}${covBlock('Screens visited', rStat, (x) => x.tag)}
        ${verRows.length ? `<details><summary>By app version</summary><table><tr><th>App</th><th>✅ ticks</th><th>Features</th><th>Screens</th><th>People</th></tr>${verRows.map((v) => `<tr><td>${v === '?' ? 'unknown' : esc(v)}${v === curApp ? ' <span class="pill ok">now</span>' : ''}</td><td>${byVer[v].ticks}</td><td>${byVer[v].feats.size}</td><td>${Object.values(rv).filter((s) => s.has(v)).length}</td><td>${byVer[v].people.size}</td></tr>`).join('')}</table></details>` : ''}
        <p style="font-size:12.5px;color:var(--faint);margin:6px 0 0">A feature counts when someone ticked ✅ a challenge that uses it. A pass on an older app version shows as “needs re-check”: every update restarts the testing. Screens come from where the coach saw testers go.</p></div>` : '';

    // ---- v2.5 · 🌱 How each tester is doing (kind words — a guide for helping, not a ranking) ----
    const skillOf = (p) => { const w = p.wk; const upto = Math.max(1, Math.min(bw.days.length, Math.max(today, ...p.cells.filter((c) => c.done || c.probs).map((c) => c.n)))); const given = bw.days.slice(0, upto).flatMap((d) => d.ch.filter((c) => c.role === p.role && c.kind === 'scenario')).length;
      const solved = w.scen.reduce((t, x) => t + (x.self === 'yes' ? 1 : x.self === 'partly' ? 0.5 : 0), 0);
      const help = [...new Set([...w.scen.filter((x) => x.self === 'no' || x.self === 'partly').map((x) => CH[x.cid].t.replace(/^🧠\s*Real-world problem:\s*/i, '')),
        ...p.drAll.filter((x) => x.j && num(x.j.ease, 1, 5) != null && x.j.ease <= 2).map((x) => CH[x._cid].t), ...p.stuck.map((x) => CH[x.cid].t)])].slice(0, 3);
      const any = p.drAll.length || p.stuck.length;
      const word = !any ? '🌱 Just starting' : !help.length ? '🌟 Doing well' : solved >= Math.max(1, w.scen.length) * 0.75 && (w.ease == null || w.ease >= 3.5) ? '🌟 Doing well' : '🙂 Getting there';
      return { given, solved, help, word }; };
    const skillHtml = list.length ? `<h3><span>🌱 How each tester is doing</span><span></span></h3><div class="card">${list.map((p) => { const w = p.wk, k = skillOf(p);
      return `<div class="tcard"><h4>${esc(p.name)} <span style="color:var(--faint);font-weight:600;font-size:13px">· ${esc(RL[p.role].short)}</span> <span class="pill ${k.word.startsWith('🌟') ? 'ok' : ''}">${k.word}</span></h4>
        <div class="kv"><b>🧠 Real-world problems</b><span>${w.scen.length ? `${k.solved} solved of ${w.scen.length} tried` : 'none tried yet'}${k.given ? ` · ${k.given} given so far` : ''}</span>
          <b>💡 Hints used</b><span>${w.hints}</span><b>😊 Ease</b><span>${w.ease != null ? w.ease.toFixed(1) + ' of 5' : '–'}</span><b>⏱ Typical time</b><span>${fmtS(w.secs)} a challenge</span>${w.stuck ? `<b>🆘 Asked for help</b><span>${w.stuck}×</span>` : ''}</div>
        ${k.help.length ? `<p style="margin:6px 0 0;font-size:13.5px">Could use a hand with: ${k.help.map(esc).join(' · ')}</p>` : ''}
        <details><summary>Day by day</summary><div class="scroll-x"><table class="dd"><tr><th>Day</th><th>✅</th><th>❌</th><th>⏱</th><th>😊</th><th>💡</th><th>🆘</th><th>🧠 Real-world problem</th></tr>${p.cells.filter((c) => c.done || c.probs || c.m.stuck).map((c) => `<tr><td>D${c.n}</td><td>${c.done}/${c.total}</td><td>${c.probs || ''}</td><td>${fmtS(c.m.secs)}</td><td>${c.m.ease != null ? c.m.ease.toFixed(1) : '–'}</td><td>${c.m.hints || ''}</td><td>${c.m.stuck || ''}</td>
          <td>${c.m.scen.map((x) => `<details class="said"><summary>${x.self ? SELFT[x.self] : '· no answer'} · ${esc(CH[x.cid].t.replace(/^🧠\s*Real-world problem:\s*/i, ''))}</summary>${x.said ? '“' + esc(x.said) + '”' : '<span style="color:var(--faint)">Nothing written.</span>'}</details>`).join('') || ''}</td></tr>`).join('') || '<tr><td colspan="8" style="color:var(--faint)">Nothing yet.</td></tr>'}</table></div></details></div>`; }).join('')}
      <p style="font-size:12.5px;color:var(--faint);margin:6px 0 0">Solved: “Did you end the same way?” yes = 1, partly = ½ (their own answer). Ease is their 1–5 face after each ✅. Use it to see who to sit with, not to rank people.</p></div>` : '';

    const html = `
      <details open id="bw-board"><summary style="cursor:pointer;list-style:none"><h3 style="margin-top:4px"><span>🏢 Business Week · ${today < 1 ? 'starts ' + esc(bw.start) : today > bw.days.length ? 'finished' : 'day ' + today + ' of ' + bw.days.length}</span><span>${list.length} people</span></h3></summary>
      ${missing ? '<div class="banner">⚙️ Confirming problems and “Mark paid” need <b>supabase/24_test_scripts.sql</b> on the training copy.</div>' : ''}
      <div class="hard card" id="bw-hard-card"><div class="hardh"><h2>🔎 How hard is each step</h2><span>${hard.length} measured</span></div>
        <p class="hsub">Where Zuri is <b>not easy yet</b>: low ease (1–5 faces), 🆘 stuck, slow, ❌ problems, 🧭 done away from the right screen. Fix from the top.</p>
        <div class="hsort" role="group" aria-label="Sort by">${Object.entries(HSORT).map(([k, [t]], i) => `<button type="button" data-hsort="${k}" class="${i ? '' : 'on'}" aria-pressed="${!i}">${t}</button>`).join('')}</div>
        <ol class="hlist" id="bw-hard">${hardList('all', false)}</ol>
        ${hard.length > 12 ? `<button class="mini" id="bw-hard-all">Show all ${hard.length}</button>` : ''}</div>
      <div class="card scroll-x"><table class="grid" id="bw-grid"><tr><th style="text-align:left">Person</th>${bw.days.map((d) => `<th title="${esc(d.title)}">D${d.n}</th>`).join('')}<th>KES</th></tr>
        ${list.map((p) => `<tr><td class="s" style="white-space:normal;min-width:120px"><b>${esc(p.name)}</b><br><span style="color:var(--faint)">${esc(RL[p.role].short)}${p.role !== 'V' && !p.prof ? ' · no Zuri account matched' : ''}</span></td>
          ${p.cells.map((c) => `<td style="text-align:center;padding:3px;border-radius:6px;background:${c.worked ? 'var(--ok-soft)' : c.done ? 'var(--amber-soft)' : 'transparent'}" title="Day ${c.n}: ${c.done}/${c.total} done · ${c.probs} problem(s), ${c.cp} confirmed${c.acts != null ? ' · ' + c.acts + ' things done in Zuri' : ''}${c.m.secs != null ? ' · median ' + fmtS(c.m.secs) + ' a challenge' : ''}${c.m.ease != null ? ' · ease ' + c.m.ease.toFixed(1) : ''}${c.m.hints ? ' · ' + c.m.hints + ' hint(s)' : ''}${c.m.stuck ? ' · stuck ' + c.m.stuck + '×' : ''}">${c.done}/${c.total}${c.probs ? `<br><span style="color:var(--bad)">❌${c.probs}</span>` : ''}${c.acts != null ? `<br><span style="color:var(--faint)">⚙️${c.acts}</span>` : ''}${c.m.ease != null ? `<br><span>😊${c.m.ease.toFixed(1)}</span>` : ''}${c.m.secs != null ? `<br><span style="color:var(--faint)">⏱${fmtS(c.m.secs)}</span>` : ''}${c.m.stuck ? `<br><span style="color:var(--bad)">🆘${c.m.stuck}</span>` : ''}${c.m.scen.length ? `<br><span>🧠${c.m.scen.map((x) => (x.self === 'yes' ? '✓' : x.self === 'partly' ? '〰' : x.self === 'no' ? '✖' : '·')).join('')}</span>` : ''}</td>`).join('')}
          <td style="text-align:right;white-space:nowrap"><b>${kes(p.earned)}</b><br><span style="color:var(--faint)">paid ${kes(p.paid)}</span>${p.owed ? `<br><button class="mini go" data-bwpay="${esc(low(p.name) + '|' + p.role)}">💵 Mark paid</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="${bw.days.length + 2}" style="color:var(--faint)">Nobody has opened Business Week yet. Their link: testers/?bw&code=${esc(bw.code)}</td></tr>`}</table>
        <p style="font-size:12.5px;color:var(--faint);margin:6px 0 0">Each square: challenges done / given · ❌ problems sent · ⚙️ things they really did in Zuri that day (jobs, notes, money, counts, customers) · 😊 average ease (1–5) · ⏱ median time a challenge · 🆘 stuck · 🧠 real-world problems (✓ yes · 〰 partly · ✖ no). Green = a paid day (${bw.pay.min_done_for_day}+ done). KES = paid days × ${bw.pay.day} + confirmed problems × ${bw.pay.problem} (max ${bw.pay.problems_cap_day} a day). A green square with ⚙️0 is worth a look before paying.</p>
        <button class="mini" id="bw-copypay">📋 Copy the pay list</button></div>
      ${covHtml}
      ${skillHtml}
      <h3><span>❌ Business Week problems</span><span>${probs.length}</span></h3>
      <div class="card">${probs.map((x) => { const c = CH[x.cid] || {}; const k = low(x.p.name) + '|bw:' + x.cid; const cf = conf[k];
        return `<div class="red" data-bwprob="${esc(x.cid)}" data-who="${esc(low(x.p.name) + '|' + x.p.role)}"><b>Day ${x.n} · ${esc(x.p.name)} (${esc(RL[x.p.role].short)}) · ${esc(c.at || '')} ${esc(c.t || x.cid)}</b><div>${esc(x.note || '')}</div><div style="color:var(--faint);font-size:12px">${esc(fmtWhen(x.at))} · expected: ${esc(c.end || '')}</div>
          <div>${cf ? (cf.status === 'confirmed' ? `<span class="flag ok">✔ Real problem · ${esc(cf.by_who || '')}</span>` : `<span class="flag amber">Not a problem · ${esc(cf.by_who || '')}</span>`) : '<span class="flag amber">not checked yet</span>'}
          <button class="mini go" data-bwconf="confirmed">✔ Real problem</button><button class="mini" data-bwconf="rejected">✖ Not a problem</button></div></div>`; }).join('') || '<div style="color:var(--faint)">No problems reported yet.</div>'}</div>
      ${list.some((p) => p.tells.length) ? `<h3><span>✍️ Business Week notes</span><span></span></h3><div class="card">${list.flatMap((p) => p.tells.map((t) => ({ ...t, p }))).sort((a, b) => (a.at < b.at ? 1 : -1)).map((t) => `<div class="row" style="cursor:default;align-items:flex-start"><div style="flex:1"><div>${esc(t.note)}</div><div class="m" style="white-space:normal">${esc(t.p.name)} · ${esc(RL[t.p.role].short)} · day ${t.n} · ${esc(fmtWhen(t.at))}</div></div></div>`).join('')}</div>` : ''}
      </details>`;
    const wire = () => {
      const by = ok.p.full_name || 'Jerry';
      const find = (key) => list.find((p) => low(p.name) + '|' + p.role === key);
      let hKey = 'all', hAll = false;
      const hPaint = () => { const ol = $('#bw-hard'); if (ol) ol.innerHTML = hardList(hKey, hAll); $$('[data-hsort]').forEach((b) => { b.classList.toggle('on', b.dataset.hsort === hKey); b.setAttribute('aria-pressed', b.dataset.hsort === hKey); }); };
      $$('[data-hsort]').forEach((b) => (b.onclick = () => { hKey = b.dataset.hsort; hPaint(); }));
      const ha = $('#bw-hard-all'); if (ha) ha.onclick = () => { hAll = !hAll; ha.textContent = hAll ? 'Show the top 12' : `Show all ${hard.length}`; hPaint(); };
      const cp = $('#bw-copypay'); if (cp) cp.onclick = () => (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(payText) : Promise.reject()).then(() => toast('Pay list copied.'), () => toast(payText.slice(0, 120)));
      $$('[data-bwprob]').forEach((box) => $$('[data-bwconf]', box).forEach((b) => (b.onclick = async () => {
        const p = find(box.dataset.who); if (!p) return;
        const r = await ok.a.from('test_confirmed').insert({ tester: p.name, role: RL[p.role].log, step: ('bw:' + box.dataset.bwprob).slice(0, 40), status: b.dataset.bwconf, by_who: by });
        if (r.error) return toast(isMissing(r.error) ? 'Run supabase/24_test_scripts.sql first.' : 'Could not save: ' + r.error.message);
        toast(b.dataset.bwconf === 'confirmed' ? `Confirmed — +${bw.pay.problem} KES for ${p.name.split(' ')[0]}.` : 'Marked: not a problem.'); setTimeout(board, 500);
      })));
      $$('[data-bwpay]').forEach((b) => (b.onclick = async () => {
        const p = find(b.dataset.bwpay); if (!p) return;
        const amt = parseInt(prompt(`How much did you send ${p.name}? (owed ${kes(p.owed)}) — send it in M-Pesa first; this only writes it down.`, String(p.owed)) || '', 10);
        if (!(amt > 0)) return;
        const code = (prompt('M-Pesa code (optional)', '') || '').trim().toUpperCase() || null;
        const r = await ok.a.from('test_payments').insert({ tester: p.name, role: RL[p.role].log, amount: amt, mpesa_code: code, paid_on: ymdL(new Date()), note: 'Business Week', by_who: by });
        if (r.error) return toast(isMissing(r.error) ? 'Run supabase/24_test_scripts.sql first.' : 'Could not save: ' + r.error.message);
        toast('Payment written down.'); setTimeout(board, 500);
      }));
    };
    return { html, wire };
  }

  // ---------- start (after the invite code) ----------
  (window.ZG ? window.ZG.ready : Promise.resolve()).then(start);
  function start() {
  if (me && window.ZG) { const st = get('state', {}); window.ZG.report({ name: me.name, role: me.role, progress: Object.values(st).filter((v) => v === 'done').length + ' done' }); }
  if (QS.has('bw') && !QS.has('board')) bwMain();                          // v2.2 · 🏢 Business Week
  else if (new URLSearchParams(location.search).has('board')) board();
  else if (new URLSearchParams(location.search).has('plan')) planEditor();
  else if (!me) askWho();
  else {
    plan = get('plan', null);
    SX.script = get('sx_script_' + SID(), null); SX.reward = get('sx_reward', REWARD_DEFAULT); SX.confirmed = get('sx_confirmed', []);
    const scriptView = () => (SCRIPT_ONLY || get('intro_done', false)) && get('view', 'list') === 'script' && SX.script && !sxState().reported;
    if (scriptView()) sxPlay(); else render();
    // fresh script, rewards and plan from the server; the list repaints, the player only if it isn't mid-answer
    Promise.all([loadPlan(), loadScript(SID()).then((sc) => { SX.script = sc; }), loadRewards()]).then(() => { if ($('#sx-note')) { const c = $('#sx-coins'); if (c) { const k = myCoins(sxState()); c.textContent = '🪙 ' + k.coins + ' ≈ KES ' + k.kes.toLocaleString('en-GB'); } return; } if (scriptView()) sxPlay(); else render(); });
    if (!get('hello', false)) { log('hello', 'start').then(() => set('hello', true)); }
    flush(); sxFlush();
  }
  }
})();
</script>
</body>
</html>
