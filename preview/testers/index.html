<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zuri Testers' List</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23504F">
<style>
  :root { --bg:#F7F4EC; --surface:#fff; --surface-2:#EFEAE0; --ink:#1F2622; --soft:#55605B; --faint:#6E7873; --brand:#23504F; --brand-soft:#23504F14; --now:#D96C4F; --now-soft:#D96C4F1C; --ok:#2F6E52; --ok-soft:#2F6E521C; --line:#E2DCCF; --line-strong:#C9C1AE; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15191A; --surface:#1D2224; --surface-2:#262C2E; --ink:#ECEAE3; --soft:#B2B8B2; --faint:#8F9893; --brand:#7FB4B1; --brand-soft:#7FB4B122; --now:#F08A6A; --now-soft:#F08A6A22; --ok:#6DC296; --ok-soft:#6DC29622; --line:#2E3537; --line-strong:#45504F; } }
  :root[data-theme="dark"] { --bg:#15191A; --surface:#1D2224; --surface-2:#262C2E; --ink:#ECEAE3; --soft:#B2B8B2; --faint:#8F9893; --brand:#7FB4B1; --brand-soft:#7FB4B122; --now:#F08A6A; --now-soft:#F08A6A22; --ok:#6DC296; --ok-soft:#6DC29622; --line:#2E3537; --line-strong:#45504F; }
  * { box-sizing:border-box; } html,body { margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; font-size:16px; line-height:1.45; padding-bottom:40px; }
  header { max-width:640px; margin:0 auto; padding:16px 16px 6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 { margin:0; font-size:21px; font-weight:800; color:var(--brand); } header h1 small { display:block; font-size:12.5px; font-weight:600; color:var(--faint); }
  .prog { font-size:13px; font-weight:800; color:var(--ok); background:var(--ok-soft); border-radius:999px; padding:6px 12px; white-space:nowrap; }
  main { max-width:640px; margin:0 auto; padding:6px 14px 20px; }
  .bar { height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin:4px 0 12px; } .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .4s; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .now { background:var(--now-soft); border:2px solid var(--now); border-radius:22px; padding:18px; margin-bottom:12px; }
  .now .lbl { font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--now); display:flex; justify-content:space-between; }
  .now h2 { margin:6px 0 2px; font-size:24px; line-height:1.2; } .now .why { color:var(--soft); font-size:15px; margin-bottom:10px; }
  .now ol { margin:0 0 10px 18px; padding:0; font-size:15.5px; } .now li { margin:7px 0; }
  .links { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; } .links a { font-size:15px; font-weight:800; text-decoration:none; color:#fff; background:var(--brand); border-radius:999px; padding:10px 15px; min-height:44px; display:inline-flex; align-items:center; }
  .btns { display:flex; gap:8px; } .btns button { font:inherit; font-weight:800; font-size:16px; padding:13px; border-radius:14px; border:none; cursor:pointer; min-height:48px; }
  .btns .done { flex:1; background:var(--ok); color:#fff; } .btns .skip { background:var(--surface); color:var(--soft); border:1px solid var(--line-strong); }
  .tell { margin-top:12px; } .tell textarea { width:100%; font:inherit; font-size:15px; padding:10px 12px; border:1.5px solid var(--line-strong); border-radius:12px; background:var(--surface); color:var(--ink); min-height:64px; resize:vertical; }
  .tell .row { display:flex; gap:8px; margin-top:6px; align-items:center; } .tell button { font:inherit; font-weight:700; padding:9px 14px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); color:var(--brand); cursor:pointer; min-height:40px; }
  .next { background:var(--brand-soft); border:1px dashed var(--brand); border-radius:14px; padding:10px 14px; margin-bottom:14px; font-size:14px; } .next b { color:var(--brand); font-size:11px; letter-spacing:.1em; text-transform:uppercase; display:block; }
  h3 { margin:16px 0 6px; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); display:flex; justify-content:space-between; }
  .row { display:flex; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:14.5px; cursor:pointer; }
  .row:first-of-type { border-top:none; }
  .row .chk { width:26px; height:26px; border-radius:7px; border:2px solid var(--line-strong); flex:none; display:flex; align-items:center; justify-content:center; font-size:15px; color:#fff; }
  .row.done .chk { background:var(--ok); border-color:var(--ok); } .row.done span.t { text-decoration:line-through; color:var(--faint); }
  .row.cur .chk { border-color:var(--now); } .row.cur span.t { color:var(--now); font-weight:800; }
  .row.skip span.t { color:var(--faint); font-style:italic; } .row span.t { flex:1; } .row .m { font-size:12px; color:var(--faint); white-space:nowrap; }
  .row .chk { width:30px; height:30px; } .row a.play { flex:none; font-weight:800; font-size:13.5px; color:#fff; background:var(--brand); border-radius:999px; padding:7px 12px; text-decoration:none; min-height:34px; display:inline-flex; align-items:center; }
  label { display:block; font-size:13px; font-weight:700; color:var(--soft); margin:10px 0 4px; }
  input, select { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1.5px solid var(--line-strong); border-radius:12px; background:var(--surface); color:var(--ink); }
  .seg { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 12px; } .seg button { flex:1 1 45%; font:inherit; font-weight:700; font-size:15px; padding:12px; min-height:48px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer; text-align:left; }
  .seg button.on { border-color:var(--brand); background:var(--brand-soft); color:var(--brand); }
  .big { width:100%; font:inherit; font-weight:800; font-size:17px; padding:14px; border-radius:14px; border:none; background:var(--brand); color:#fff; cursor:pointer; min-height:50px; }
  .win { background:linear-gradient(160deg,#F2B134,#D96C4F 55%,#23504F); color:#fff; border-radius:22px; padding:24px; text-align:center; margin-bottom:12px; } .win h2 { margin:6px 0; font-size:26px; }
  .foot { font-size:12px; color:var(--faint); text-align:center; margin-top:18px; } .foot button, .foot a { font:inherit; font-size:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:8px; padding:4px 9px; cursor:pointer; text-decoration:none; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; font-size:14px; z-index:50; max-width:90vw; opacity:0; transition:opacity .2s; pointer-events:none; } .toast.show { opacity:1; }
  table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; } th { font-size:12px; color:var(--faint); text-transform:uppercase; }
  .pill { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--soft); } .pill.ok { background:var(--ok-soft); color:var(--ok); }
  /* v2.0 · the test script */
  :root { --bad:#B23A2E; --bad-soft:#B23A2E1A; --amber:#9A6200; --amber-soft:#E8A31726; --grey:#C9C1AE; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bad:#F08A7E; --bad-soft:#F08A7E22; --amber:#F2C25B; --amber-soft:#F2C25B22; --grey:#45504F; } }
  :root[data-theme="dark"] { --bad:#F08A7E; --bad-soft:#F08A7E22; --amber:#F2C25B; --amber-soft:#F2C25B22; --grey:#45504F; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; } .chip { font-size:13px; font-weight:800; padding:5px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--soft); white-space:nowrap; }
  .chip.coin { color:#8A5A00; background:#F2B13426; border-color:#F2B13466; } .chip.late { color:var(--bad); background:var(--bad-soft); border-color:transparent; }
  .chip.timer.over { color:var(--amber); background:var(--amber-soft); border-color:transparent; }
  .sx { background:var(--surface); border:2px solid var(--brand); border-radius:20px; padding:16px; margin-bottom:12px; }
  .sx .lbl { font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color:var(--brand); display:flex; justify-content:space-between; gap:8px; }
  .sx h2 { margin:4px 0 10px; font-size:20px; line-height:1.25; }
  .sx .part { border-radius:14px; padding:12px; margin:8px 0; } .sx .part b.h { display:block; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px; }
  .sx .do { background:var(--now-soft); } .sx .do b.h { color:var(--now); } .sx .do p { margin:0; font-size:17px; line-height:1.45; }
  .sx .see { background:var(--ok-soft); } .sx .see b.h { color:var(--ok); } .sx .see p { margin:0; font-size:15.5px; }
  .sx .tip { font-size:13.5px; color:var(--soft); margin:6px 0 0; }
  .sx .copy { display:flex; gap:8px; align-items:center; margin-top:8px; background:var(--surface); border:1px dashed var(--line-strong); border-radius:10px; padding:6px 8px; font-family:ui-monospace,Menlo,monospace; font-size:13.5px; word-break:break-all; }
  .sx .copy span { flex:1; } .sx .copy button { font:inherit; font-family:-apple-system,system-ui,sans-serif; font-weight:800; font-size:13px; border:none; border-radius:8px; background:var(--brand); color:#fff; padding:8px 10px; min-height:36px; cursor:pointer; }
  .sx a.open { display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; font-weight:800; font-size:15.5px; color:#fff; background:var(--brand); border-radius:14px; padding:12px; min-height:48px; margin:8px 0; }
  .ans { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; } .ans button { font:inherit; font-weight:800; font-size:15px; padding:12px 6px; border-radius:14px; border:2px solid var(--line-strong); background:var(--surface); color:var(--ink); min-height:64px; cursor:pointer; line-height:1.2; }
  .ans button.ok.on { background:var(--ok); border-color:var(--ok); color:#fff; } .ans button.fail.on { background:var(--bad); border-color:var(--bad); color:#fff; } .ans button.unsure.on { background:var(--amber); border-color:var(--amber); color:#fff; }
  .what { margin-top:10px; background:var(--surface-2); border-radius:14px; padding:12px; } .what textarea { width:100%; font:inherit; font-size:16px; padding:10px; border:1.5px solid var(--line-strong); border-radius:12px; background:var(--surface); color:var(--ink); min-height:80px; }
  .what .hint { font-size:13px; color:var(--faint); margin:4px 0 8px; } .what img { max-width:120px; max-height:160px; border-radius:8px; display:block; margin-top:6px; border:1px solid var(--line); }
  .what .row2 { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; } .what .row2 > * { font:inherit; font-weight:800; font-size:15px; padding:11px 14px; border-radius:12px; min-height:46px; cursor:pointer; border:1px solid var(--line-strong); background:var(--surface); color:var(--brand); display:inline-flex; align-items:center; }
  .what .row2 .save { background:var(--brand); color:#fff; border:none; flex:1; justify-content:center; }
  .nav2 { display:flex; justify-content:space-between; gap:8px; margin-top:12px; } .nav2 button { font:inherit; font-weight:800; font-size:15px; padding:11px 14px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); min-height:46px; cursor:pointer; } .nav2 button:disabled { opacity:.4; cursor:default; }
  .dots { display:flex; flex-wrap:wrap; gap:5px; margin:10px 0 0; } .dots button { width:30px; height:30px; border-radius:8px; border:1.5px solid var(--line-strong); background:var(--surface); font:inherit; font-size:12px; font-weight:800; color:var(--soft); cursor:pointer; padding:0; }
  .dots button.ok { background:var(--ok); border-color:var(--ok); color:#fff; } .dots button.fail { background:var(--bad); border-color:var(--bad); color:#fff; } .dots button.unsure { background:var(--amber); border-color:var(--amber); color:#fff; }
  .dots button.cur { outline:3px solid var(--now); outline-offset:1px; } .dots button:disabled { opacity:.35; cursor:default; }
  .scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.grid { border-collapse:separate; border-spacing:2px; font-size:12px; width:auto; } table.grid th, table.grid td { padding:3px 5px; border:none; white-space:nowrap; }
  table.grid td.s { max-width:150px; overflow:hidden; text-overflow:ellipsis; position:sticky; left:0; background:var(--surface); z-index:1; }
  table.grid td.c { width:30px; height:24px; border-radius:5px; text-align:center; font-weight:800; cursor:pointer; color:#fff; }
  td.c.ok { background:var(--ok); } td.c.fail { background:var(--bad); } td.c.unsure { background:var(--amber); } td.c.none { background:var(--surface-2); color:var(--faint); }
  .tcard { border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 0; background:var(--surface); } .tcard h4 { margin:0 0 4px; font-size:16px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13.5px; } .kv b { color:var(--soft); font-weight:700; }
  .flag { display:inline-block; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--bad-soft); color:var(--bad); margin:2px 4px 2px 0; } .flag.amber { background:var(--amber-soft); color:var(--amber); } .flag.ok { background:var(--ok-soft); color:var(--ok); }
  .red { border-left:4px solid var(--bad); padding:6px 8px; margin:6px 0; background:var(--bad-soft); border-radius:8px; font-size:13.5px; } .red.unsure { border-color:var(--amber); background:var(--amber-soft); }
  .red img { max-width:110px; max-height:150px; border-radius:6px; display:block; margin-top:4px; }
  .mini { font:inherit; font-size:13px; font-weight:800; padding:7px 10px; border-radius:9px; border:1px solid var(--line-strong); background:var(--surface); color:var(--brand); cursor:pointer; min-height:36px; margin:4px 4px 0 0; }
  .mini.go { background:var(--brand); color:#fff; border:none; } a.mini { display:inline-flex; align-items:center; text-decoration:none; }
  .form3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; } .form3 input { padding:8px; font-size:15px; } .form3 label { margin:4px 0 2px; font-size:12px; }
  .banner { background:var(--amber-soft); border:1px solid var(--amber); color:var(--ink); border-radius:12px; padding:10px 12px; font-size:14px; margin-bottom:12px; }
</style>

<body>
<header><h1>🧪 Zuri Testers' List <small id="sub">One step at a time · tick as you go</small></h1><span class="prog" id="prog" hidden>0 / 0</span></header>
<main id="main"><div class="card">Loading…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/selfcheck.js?v=2"></script>
<script src="../js/gate.js?v=43"></script>
<script src="../js/checklist_data.js?v=54"></script>
<script>
(function () {
  const VERSION = 'v2.1 · 2026-10-12';
  // v2.1 (12 Oct): ONE-SCRIPT LINKS — testers/?script=projects&n=Nicholas&code=ZURI-TEST opens only the 📈 Projects script
  //       (scripts/projects.json) for someone with no Zuri job or account: practice as finance, a plain-words welcome, his
  //       video, then the steps. Kept apart on the phone (its own name, answers and progress). Everything else is unchanged.
  // v2.0 (10 Oct): the TEST SCRIPT. Jerry: testers "don't seem to understand what to do and we need to verify that everything
  //       has been tested". Each job gets a script (testers/scripts/<job>.json): numbered steps, each "Do this" + "You should see",
  //       answered ✅ / ❌ / 🤷 (❌ and 🤷 ask what happened, with an optional screenshot). Sessions with a gentle timer, finish-by
  //       date, coins, and a report. The board (?board) gains the step × tester grid, rushing flags, nudges, rewards and Mark paid.
  //       Answers go to script_answers (supabase/24_test_scripts.sql); until that SQL is run, answers wait on the phone and
  //       the ❌/🤷 notes still reach the board through tester_log, so nothing old breaks.
  // v1.8 (7 Oct deep check): #16 the board and the plan editor need a partner signed in to the training copy;
  //       #33 "Open practice as Call center" (was "as Call") and no picker steps — the link already picks the job.
  // v1.4: tapping a row no longer ticks it (Veronica tapped “▶ How to test” to play it and it ticked instead).
  //       The box ticks; the words open that step; video rows get their own ▶ Play button.
  let pick = null;
  const C = window.ZURI_CONFIG.training;                                   // the Testers' List always talks to the training copy
  const sb = supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: false } });
  // v2.0: same address as before on the live site; a local copy (tests, previews) links to its own practice.
  const APP = location.hostname === 'jerrywins1.github.io' ? 'https://jerrywins1.github.io/zuri-system/' : new URL('../', location.href).href;
  const FS = 'https://jerrywins1.github.io/daraja-apps/feedback-studio/?app=';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const get = (k, d) => { try { const v = localStorage.getItem('zt_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const set = (k, v) => { try { localStorage.setItem('zt_' + k, JSON.stringify(v)); } catch (e) {} };
  let toastT; const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); };
  const $ = (s, r = document) => r.querySelector(s); const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ROLES = { field: '🛠️ Field tech', callcenter: '📞 Call center', finance: '💰 Finance (office)', admin: '⭐ Partner / manager' };
  const SHORT = { field: 'a field tech', callcenter: 'the call center', finance: 'finance', admin: 'a partner' }; // 7 Oct deep check #33
  // v2.1: a one-script link (?script=projects) — its own "me", practising as finance
  const QS = new URLSearchParams(location.search);
  const ONE = { projects: { role: 'finance', label: '📈 Projects tester', title: 'Test 📈 Projects' } };
  const SCRIPT_ONLY = ONE[QS.get('script')] ? QS.get('script') : null;
  const MEKEY = SCRIPT_ONLY ? 'me_' + SCRIPT_ONLY : 'me';
  let me = get(MEKEY, null);                                               // { name, role, device } (+ script)
  if (SCRIPT_ONLY) {
    const n = (QS.get('n') || '').trim().replace(/\s+/g, ' ').slice(0, 60);
    if (n && (!me || me.name !== n)) { me = { name: n, role: ONE[SCRIPT_ONLY].role, script: SCRIPT_ONLY }; set(MEKEY, me); }
    if (me) { me.role = ONE[SCRIPT_ONLY].role; me.script = SCRIPT_ONLY; }
  }
  const SID = () => (me && me.script) || (me && me.role);                // which script file / progress this phone runs
  const WHO = () => (me && me.script ? ONE[me.script].label : ROLES[me.role]);
  // v1.5 (6 Oct): every practice link carries the invite code, so a link that opens in another browser
  // (WhatsApp's own browser → Chrome, phone → computer) doesn't stop at the code screen (Emmanuel: "trouble logging in").
  const CODE = () => { try { return (window.ZG && ZG.code()) || ''; } catch (e) { return ''; } };
  const withCode = (q) => (CODE() ? q + '&code=' + encodeURIComponent(CODE()) : q);
  const practice = (role, play) => APP + withCode('?practice&role=' + role + (play ? '&play=' + play : '')) + '#learn';
  const fsLink = (role) => FS + encodeURIComponent(APP + withCode('?practice&role=' + role));

  // ---------- the steps, in order, for one job ----------
  function stepsFor(role) {
    const vid = (id, title, mins, why, vrole) => ({ id: 'v-' + id, sec: 'Watch', t: '▶ ' + title + ' (' + mins + ' min)', why, how: ['Tap the link — practice opens and the video starts by itself (sound on).', 'After it ends, a “Your turn” list appears: do it, then come back here and tap Done.'], links: [['▶ Play it', practice(vrole || role, id)]] });
    const S = [
      vid('howtest', 'How to test Zuri', 2, 'What we need from you, and the three ways to tell us.'),
      vid('tour', 'What Zuri is — the whole system', 5, 'Who it is for, and one job followed from the call to the fix.', 'admin'),
      vid('day-1', 'A day in the life (5 chapters)', 17, 'One working day through Kelvin, Mary, Peter and the partners. It switches person by itself; just watch.', 'finance'),
      { id: 's-install', sec: 'Get ready', t: '📱 Put Zuri on your phone', why: 'Opened from an icon, Zuri works like an app, even with weak signal.', how: ['Open the practice link below in Chrome.', 'Tap ⋮ (top right) → Add to Home screen → Add.', 'From now on, open Zuri from the icon.'], links: [['🎓 Open practice', APP + withCode('?practice')]] },
      // 7 Oct deep check #33: the link already carries the job, so practice opens as you — no picker to tap.
      { id: 's-pick', sec: 'Get ready', t: '🙂 Open practice as your job', why: 'Practice is pretend customers and pretend money, on your phone only. Nothing you do is real.', how: ['Tap the button below. Practice opens as ' + SHORT[role] + ' straight away.', 'Look around for a minute, then come back here.'], links: [['🎓 Open practice as ' + SHORT[role], practice(role)]] },
    ];
    const mine = { field: ['start', 'tasks', 'field-jobs', 'field-extras'], callcenter: ['start', 'tasks', 'cc-followups', 'cc-newjob', 'customers'], finance: ['start', 'tasks', 'fin-daily', 'fin-bills', 'fin-statements'], admin: ['start', 'tasks', 'partners', 'admin', 'fin-daily', 'fin-bills'] }[role];
    const NAMES = { start: ['Welcome to Zuri', 2, null], tasks: ['Your task list', 2, 'field'], 'field-jobs': ['Doing a job, start to finish', 3, 'field'], 'field-extras': ['Photos, parts, map pins, new jobs', 3, 'field'], 'cc-followups': ['Payment follow-up calls', 3, 'callcenter'], 'cc-newjob': ['A customer calls with a problem', 2, 'callcenter'], customers: ['Finding a customer', 2, 'callcenter'], 'fin-daily': ['Daily money: count, record, check', 3, 'finance'], 'fin-bills': ['Paying the monthly bills', 2, 'finance'], 'fin-statements': ['Bank & M-Pesa statements', 3, 'finance'], partners: ['Running the company from Home', 3, 'admin'], admin: ['Adding a new staff member', 2, 'admin'] };
    mine.forEach((id) => { const [t, m, r] = NAMES[id]; S.push(vid(id, t, m, 'The video for your job. Watch, then do the Your-turn list.', r || role)); });
    // the checklist lines for this job, from the same list the app uses
    const groups = (window.ZURI_CHECKLIST || []).filter((g) => g.roles.includes(role === 'finance' ? 'internal' : role) && (!g.dept || role === 'finance' || role === 'admin'));
    groups.forEach((g) => g.items.forEach((i) => S.push({ id: 'c-' + i.id, sec: 'Try it yourself', t: '🧪 ' + i.t, why: g.label + '. Do it in practice, then tick it. If anything was confusing, slow or wrong, write it in the box below.', how: [i.how], links: [['🎓 Open practice', practice(role)]].concat(i.lesson ? [['▶ Show me', practice(role === 'finance' && /fin|partners|admin/.test(i.lesson) ? (/partners|admin/.test(i.lesson) ? 'admin' : 'finance') : role, i.lesson)]] : []) })));
    S.push(
      { id: 's-signup', sec: 'Join the training copy', t: '🟠 Make your account on the TRAINING copy', why: 'Training is a real shared system on pretend data: what you do, your teammates see. This is where you work like a real day.', how: ['Open the training link. Tap Create my account.', 'Your name, your phone number, your email, a password. Tap Create account.', 'Open the email we send and tap the link.'], links: [['🟠 Open the training copy', APP + withCode('?training')]] },
      { id: 's-tell', sec: 'Join the training copy', t: '🙋 Tell Jerry “signed up”', why: 'A partner switches your account on and gives you your job. Until then the app says “Almost there”.', how: ['WhatsApp Jerry: “signed up”.', 'When he says done, open the training copy and sign in.'], links: [] },
      { id: 's-realday', sec: 'Join the training copy', t: '📅 Do one real day on the training copy', why: 'Jobs, calls, counts and payments — the way you would on a real day. Your teammates will see them.', how: ['Do your normal work in the training copy for one day.', 'Note anything that slowed you down.'], links: [['🟠 Open the training copy', APP + withCode('?training')]] },
      { id: 's-fs', sec: 'Tell us', t: '🎙 Talk through one session in Feedback Studio', why: 'Talking while you use it is the best report there is. Point at anything wrong.', how: ['Open the link: Zuri on top, the red button underneath.', 'Press the red button and say what you think as you tap around. 👆 Point, then tap the thing that is wrong.', '✅ I\'m done → 📨 Send to Claude → send it to Jerry.'], links: [['🎙 Open Zuri in Feedback Studio', fsLink(role)]] },
      { id: 's-three', sec: 'Tell us', t: '✍️ Write the three most confusing things', why: 'Even three words each helps. Write them in the box below and tap Send to Claude.', how: ['What confused you most?', 'What was slow?', 'What would you change first?'], links: [] },
    );
    return S;
  }

  // ---------- saving: on the phone, and up to the training copy ----------
  const device = get('device', null) || (() => { const d = 'd' + Math.random().toString(36).slice(2, 10); set('device', d); return d; })();
  let state = get('state', {});                                             // stepId → 'done' | 'skip'
  async function log(kind, step, note) {
    if (!me) return;
    const row = { tester: me.name, role: me.role, device, step, kind, note: note || null, version: VERSION };
    try { const { error } = await sb.from('tester_log').insert(row); if (error) throw error; return true; }
    catch (e) { const q = get('queue', []); q.push(row); set('queue', q); return false; }
  }
  async function flush() { const q = get('queue', []); if (!q.length) return; const { error } = await sb.from('tester_log').insert(q); if (!error) set('queue', []); }
  window.addEventListener('online', flush);

  // ---------- the plan: what the partners asked this tester to test ----------
  let plan = null;                                                        // { steps: [...ids] | [], focus }
  async function loadPlan() {
    try {
      const { data } = await sb.from('tester_plan').select('*').order('at', { ascending: false }).limit(200);
      const rows = data || [];
      plan = rows.find((r) => r.tester.trim().toLowerCase() === me.name.trim().toLowerCase())
          || rows.find((r) => r.tester === '*' && (!r.role || r.role === me.role)) || null;
      set('plan', plan);
    } catch (e) { plan = get('plan', null); }
  }
  function planned(steps) {
    if (!plan || !Array.isArray(plan.steps) || !plan.steps.length) return steps;
    return steps.filter((s) => plan.steps.includes(s.id));
  }

  // ======================================================================================================
  // ---------- v2.0 · the TEST SCRIPT: numbered steps, Do this / You should see, ✅ ❌ 🤷 ----------
  // ======================================================================================================
  const SX = { script: null, role: null, loaded: false, reward: { kes_per_script: 500, kes_per_problem: 50, weekly_cap: 1500 }, confirmed: [], serverOk: null };
  const REWARD_DEFAULT = { kes_per_script: 500, kes_per_problem: 50, weekly_cap: 1500 };
  const FINISH_DAYS = 7, RUSH_SECS = 6;
  const pad2 = (n) => String(n).padStart(2, '0');
  const ymdL = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  // {dmy} {day} {tomorrow} in a step become today's real values, so the example M-Pesa message and pay day always fit.
  const tokens = (s) => { const d = new Date(), t = new Date(Date.now() + 864e5); return String(s || '').replace(/\{dmy\}/g, pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2)).replace(/\{day\}/g, String(d.getDate())).replace(/\{today\}/g, ymdL(d)).replace(/\{tomorrow\}/g, ymdL(t)); };
  const fmtDay = (t) => new Date(t).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtWhen = (t) => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const mmss = (s) => Math.floor(s / 60) + ':' + pad2(Math.floor(s % 60));
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  const ANS = { ok: ['✅', 'It worked'], fail: ['❌', "It didn't"], unsure: ['🤷', 'Not sure'] };
  // The steps that count: pending sessions (e.g. Receipts, until it is switched on) are left out everywhere.
  const liveSessions = (sc) => (sc ? sc.sessions.filter((s) => !s.pending) : []);
  const liveSteps = (sc) => liveSessions(sc).flatMap((s) => s.steps.map((st) => ({ ...st, sid: s.id })));
  const coinValue = (sc, rw) => { const n = liveSteps(sc).length + 10; return n ? Math.round((rw || SX.reward).kes_per_script / n) : 0; };
  const isMissing = (err) => !!err && (err.code === 'PGRST205' || err.code === '42P01' || /does not exist|could not find the table|schema cache/i.test(err.message || ''));

  async function loadScript(role) {
    const key = 'sx_script_' + role;
    try {
      const r = await fetch('scripts/' + role + '.json?v=' + encodeURIComponent(VERSION.split(' ')[0]), { cache: 'no-cache' });
      if (!r.ok) throw new Error('script ' + r.status);
      const sc = await r.json();
      if (!sc || !Array.isArray(sc.sessions)) throw new Error('bad script');
      set(key, sc); return sc;
    } catch (e) { return get(key, null); }                                  // offline: the copy this phone saw last time
  }
  // One phone, one job: everything about this tester's run of the script.
  const sxKey = () => 'sx_' + SID();
  const sxState = () => get(sxKey(), { answers: {}, cur: null, sessSecs: {}, first: null, last: null, reported: null });
  const sxSave = (st) => set(sxKey(), st);

  async function loadRewards() {
    try {
      const { data, error } = await sb.from('test_reward_settings').select('*').order('at', { ascending: false }).limit(1);
      if (error) throw error;
      if (data && data[0]) SX.reward = { kes_per_script: data[0].kes_per_script, kes_per_problem: data[0].kes_per_problem, weekly_cap: data[0].weekly_cap };
      set('sx_reward', SX.reward);
    } catch (e) { SX.reward = get('sx_reward', REWARD_DEFAULT); }
    try {
      const { data, error } = await sb.from('test_confirmed').select('*').order('at', { ascending: false }).limit(1000);
      if (error) throw error;
      const latest = {};
      (data || []).filter((r) => r.tester.trim().toLowerCase() === me.name.trim().toLowerCase() && r.role === me.role).forEach((r) => { if (!latest[r.step]) latest[r.step] = r; });
      SX.confirmed = Object.values(latest).filter((r) => r.status === 'confirmed').map((r) => r.step);
      set('sx_confirmed', SX.confirmed);
    } catch (e) { SX.confirmed = get('sx_confirmed', []); }
  }
  function myCoins(st) {
    const live = liveSteps(SX.script);
    const answered = live.filter((s) => st.answers[s.id]).length;
    const confirmed = SX.confirmed.filter((id) => st.answers[id] && ['fail', 'unsure'].includes(st.answers[id].a)).length;
    const coins = answered + 5 * confirmed + (st.reported ? 10 : 0);
    const kes = st.reported ? SX.reward.kes_per_script + confirmed * SX.reward.kes_per_problem : Math.round(answered * coinValue(SX.script)) + confirmed * SX.reward.kes_per_problem;
    return { coins, kes, answered, total: live.length, confirmed };
  }
  const finishBy = (st) => (st.first ? new Date(new Date(st.first).getTime() + FINISH_DAYS * 864e5) : null);

  // ---------- sending answers: on the phone first, then up to the training copy ----------
  async function sxFlush() {
    const q = get('sxq', []); if (!q.length || !navigator.onLine) return;
    const keep = [];
    for (const row of q) {
      try {
        const { error } = await sb.from('script_answers').insert(row);
        if (error && !/duplicate|23505/i.test(error.message + (error.code || ''))) { if (isMissing(error)) SX.serverOk = false; throw error; }
        SX.serverOk = true;
      } catch (e) { keep.push(row); }
    }
    try { set('sxq', keep.slice(-400)); } catch (e) {}
  }
  function sxQueue(row) {
    const q = get('sxq', []); q.push(row);
    try { localStorage.setItem('zt_sxq', JSON.stringify(q.slice(-400))); }
    catch (e) { row.shot = null; row.note = (row.note || '') + ' (screenshot too big to keep on this phone)'; try { localStorage.setItem('zt_sxq', JSON.stringify(q.slice(-400))); } catch (e2) {} }
    sxFlush();
  }
  window.addEventListener('online', sxFlush);

  // A photo from the phone's library, made small enough to send on weak signal (max 900 px, JPEG).
  function shrink(file) {
    return new Promise((ok) => {
      const fr = new FileReader();
      fr.onload = () => { const img = new Image(); img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); let q = 0.6, u = c.toDataURL('image/jpeg', q); while (u.length > 380000 && q > 0.2) { q -= 0.15; u = c.toDataURL('image/jpeg', q); } ok(u);
      }; img.onerror = () => ok(null); img.src = fr.result; };
      fr.onerror = () => ok(null); fr.readAsDataURL(file);
    });
  }

  // ---------- the session timer: counts only while the script is on screen ----------
  let tick = null, tickFrom = 0, tickSid = null;
  function timerStop() {
    if (tickSid && tickFrom) { const st = sxState(); st.sessSecs[tickSid] = (st.sessSecs[tickSid] || 0) + (Date.now() - tickFrom) / 1000; sxSave(st); }
    clearInterval(tick); tick = null; tickFrom = 0; tickSid = null;
  }
  function timerStart(sid, target) {
    timerStop(); tickSid = sid; tickFrom = Date.now(); SX.target = target;
    const paint = () => { const el = $('#sx-timer'); if (!el) return; const st = sxState(); const s = (st.sessSecs[sid] || 0) + (Date.now() - tickFrom) / 1000;
      el.textContent = '⏱ ' + mmss(s) + ' of ~' + target + ' min'; el.classList.toggle('over', s > target * 60);
      el.title = s > target * 60 ? 'Over the guide time — no rush, finish carefully.' : 'A guide, not a limit.'; };
    paint(); tick = setInterval(() => { if (document.hidden) return; paint(); }, 1000);
  }
  // Phone locked or another tab (practice) in front: the clock pauses, and carries on when the tester comes back.
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (tickSid) { SX.paused = [tickSid, SX.target]; timerStop(); } } else if (SX.paused) { const [sid, tg] = SX.paused; SX.paused = null; if ($('#sx-timer')) timerStart(sid, tg); } });
  const sessSecsNow = (sid) => { const st = sxState(); return Math.round((st.sessSecs[sid] || 0) + (tickSid === sid && tickFrom ? (Date.now() - tickFrom) / 1000 : 0)); };

  // ---------- the script on the main list: one card at the top ----------
  function sxCard() {
    if (!SX.script) return '';
    const st = sxState(); const c = myCoins(st); const live = liveSteps(SX.script);
    const fb = finishBy(st); const late = fb && !st.reported && Date.now() > fb.getTime();
    const next = live.find((s) => !st.answers[s.id]);
    const sess = next ? liveSessions(SX.script).findIndex((s) => s.id === next.sid) : -1;
    return `<div class="sx" id="sx-card"><div class="lbl"><span>📝 Your test script</span><span>${c.answered} / ${c.total}</span></div>
      <h2 style="margin-bottom:6px">${st.reported ? 'Finished and sent — asante sana!' : c.answered ? 'Carry on where you stopped' : 'Test Zuri step by step'}</h2>
      <div style="color:var(--soft);font-size:14.5px;margin-bottom:8px">${st.reported ? 'Your report reached Jerry.' : next ? `Next: session ${sess + 1} of ${liveSessions(SX.script).length}, step ${live.filter((s) => s.sid === next.sid).indexOf(next) + 1} — about ${liveSessions(SX.script)[sess].mins} minutes a session.` : 'Every step answered — send your report.'}</div>
      <div class="chips"><span class="chip coin">🪙 ${c.coins} coins ≈ KES ${c.kes.toLocaleString('en-GB')}</span>${fb ? `<span class="chip ${late ? 'late' : ''}">${late ? '⏰ Overdue — was due ' : '📅 Finish by '}${fmtDay(fb)}</span>` : `<span class="chip">📅 ${FINISH_DAYS} days from your first step</span>`}</div>
      <div class="bar"><i style="width:${Math.round((c.answered / Math.max(1, c.total)) * 100)}%"></i></div>
      <button class="big" id="sx-go">${st.reported ? '📝 See my answers' : c.answered ? '▶ Continue my test script' : '▶ Start my test script'}</button>
      <p style="font-size:12.5px;color:var(--faint);margin:8px 0 0">Finish it and send the report: KES ${SX.reward.kes_per_script.toLocaleString('en-GB')}. Each real problem you find: +KES ${SX.reward.kes_per_problem}.</p></div>`;
  }

  // ---------- the player: one step at a time ----------
  let sxPick = null;                                                       // a step the tester went back to
  function sxOrder() { return liveSteps(SX.script); }
  function sxCurrent(st) {
    const all = sxOrder();
    if (sxPick && all.some((s) => s.id === sxPick)) return all.find((s) => s.id === sxPick);
    return all.find((s) => !st.answers[s.id]) || null;
  }
  const canOpen = (st, id) => { const all = sxOrder(); const i = all.findIndex((s) => s.id === id); const firstOpen = all.findIndex((s) => !st.answers[s.id]); return i >= 0 && (firstOpen < 0 || i <= firstOpen); };

  function sxPlay() {
    set('view', 'script');
    const st = sxState(); const all = sxOrder(); const cur = sxCurrent(st);
    $('#prog').hidden = false; $('#prog').textContent = `${all.filter((s) => st.answers[s.id]).length} / ${all.length}`;
    $('#sub').textContent = `${me.name} · ${WHO()} · test script`;
    if (!cur) { timerStop(); return sxFinish(); }
    const sessions = liveSessions(SX.script); const sess = sessions.find((s) => s.id === cur.sid); const si = sessions.indexOf(sess);
    const inSess = sess.steps; const k = inSess.findIndex((s) => s.id === cur.id);
    // A new session starts with a short intro screen (once).
    const seen = get('sx_intro_' + SID(), {});
    if (k === 0 && !st.answers[cur.id] && !seen[sess.id]) return sxSessionIntro(sess, si, sessions.length);
    const a = st.answers[cur.id]; const c = myCoins(st);
    const fb = finishBy(st); const late = fb && Date.now() > fb.getTime();
    const link = cur.link ? APP + withCode('?practice&role=' + me.role) + cur.link : APP + withCode('?practice&role=' + me.role);
    const idx = all.findIndex((s) => s.id === cur.id);
    $('#main').innerHTML = `
      <div class="chips"><span class="chip timer" id="sx-timer">⏱</span><span class="chip coin" id="sx-coins">🪙 ${c.coins} ≈ KES ${c.kes.toLocaleString('en-GB')}</span>${fb ? `<span class="chip ${late ? 'late' : ''}">${late ? '⏰ Overdue' : '📅 by ' + fmtDay(fb)}</span>` : ''}</div>
      <div class="sx"><div class="lbl"><span>Session ${si + 1} of ${sessions.length} · ${esc(sess.title)}</span><span>Step ${k + 1} of ${inSess.length}</span></div>
        <a class="open" id="sx-open" href="${esc(link)}" target="_blank" rel="noopener">🎓 Open practice at this screen</a>
        <div class="part do"><b class="h">1 · Do this</b><p>${esc(tokens(cur.do))}</p>
          ${cur.copy ? `<div class="copy"><span id="sx-copytext">${esc(tokens(cur.copy))}</span><button type="button" id="sx-copy">📋 Copy</button></div>` : ''}
          ${cur.tip ? `<p class="tip">💡 ${esc(tokens(cur.tip))}</p>` : ''}</div>
        <div class="part see"><b class="h">2 · You should see</b><p>${esc(tokens(cur.see))}</p></div>
        <b style="display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:12px">3 · Did it work?</b>
        <div class="ans">${Object.entries(ANS).map(([k2, [ic, t]]) => `<button type="button" class="${k2} ${a && a.a === k2 ? 'on' : ''}" data-a="${k2}" aria-pressed="${!!(a && a.a === k2)}"><span style="font-size:22px;display:block">${ic}</span>${t}</button>`).join('')}</div>
        <div id="sx-what"></div>
        <div class="nav2"><button type="button" id="sx-back" ${idx > 0 ? '' : 'disabled'}>← Back</button><button type="button" id="sx-list">☰ My list</button><button type="button" id="sx-next" ${a ? '' : 'disabled'}>Next →</button></div>
        <div class="dots" aria-label="Steps in this session">${inSess.map((s, i) => { const aa = st.answers[s.id]; const open = canOpen(st, s.id); return `<button type="button" data-step="${s.id}" class="${aa ? aa.a : ''} ${s.id === cur.id ? 'cur' : ''}" ${open ? '' : 'disabled'} aria-label="Step ${i + 1}${aa ? ': ' + ANS[aa.a][1] : open ? '' : ' (locked)'}">${i + 1}</button>`; }).join('')}</div>
      </div>
      <p class="foot">Zuri Testers' List ${VERSION} · script ${esc(SX.script.version || '')}${SX.serverOk === false ? ' · answers wait on this phone until the board is switched on' : ''}</p>`;
    timerStart(sess.id, sess.mins || 20);
    const cp = $('#sx-copy'); if (cp) cp.onclick = () => { const t = $('#sx-copytext').textContent; (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied — paste it in Zuri.'), () => { const r = document.createRange(); r.selectNodeContents($('#sx-copytext')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected — tap Copy on your phone.'); }); };
    $$('.ans button').forEach((b) => (b.onclick = () => (b.dataset.a === 'ok' ? sxAnswer(cur, 'ok', a && a.a === 'ok' ? a.note : '', null) : sxWhat(cur, b.dataset.a, a))));
    if (a && a.a !== 'ok' && sxPick === cur.id) sxWhat(cur, a.a, a, true);
    $('#sx-back').onclick = () => { if (idx > 0) { sxPick = all[idx - 1].id; sxPlay(); window.scrollTo(0, 0); } };
    $('#sx-next').onclick = () => { if (!a) return; const nx = all[idx + 1]; sxPick = nx && st.answers[nx.id] ? nx.id : null; sxPlay(); window.scrollTo(0, 0); };
    $('#sx-list').onclick = () => { timerStop(); set('view', 'list'); sxPick = null; render(); window.scrollTo(0, 0); };
    $$('.dots button[data-step]').forEach((b) => (b.onclick = () => { if (b.disabled) return; sxPick = st.answers[b.dataset.step] ? b.dataset.step : null; sxPlay(); }));
  }

  function sxSessionIntro(sess, si, n) {
    timerStop();
    $('#main').innerHTML = `<div class="now"><div class="lbl"><span>Session ${si + 1} of ${n}</span><span>about ${sess.mins} minutes</span></div>
      <h2>${esc(sess.title)}</h2><div class="why">${esc(sess.intro || '')}</div>
      <ol><li>Each step says what to <b>do</b> in practice, and what you <b>should see</b>.</li><li>Tap 🎓 <b>Open practice at this screen</b> — it opens in a new tab. Come back here to answer.</li><li>Answer every step: ✅ It worked, ❌ It didn't, or 🤷 Not sure. Wrong is useful — tell us what happened.</li><li>The timer is a guide, not a limit. Take your time; stop any time — this phone remembers where you are.</li></ol>
      ${SX.script.who && si === 0 ? `<p style="margin:0 0 10px;color:var(--soft)">🙂 ${esc(SX.script.who)}</p>` : ''}
      <button class="big" id="sx-start">▶ Start session ${si + 1}</button></div>

    $('#sx-start').onclick = () => { const s = get('sx_intro_' + SID(), {}); s[sess.id] = Date.now(); set('sx_intro_' + SID(), s); sxPlay(); };

  }

  // ❌ / 🤷 → "What happened?" (type, talk with the keyboard's 🎤, or add a screenshot from the photo library)
  function sxWhat(step, kind, prev, reopen) {
    $$('.ans button').forEach((b) => { b.classList.toggle('on', b.dataset.a === kind); b.setAttribute('aria-pressed', b.dataset.a === kind); });
    let shot = prev && prev.a === kind ? prev.shot || null : null;

    $('#sx-save').onclick = () => { const n = $('#sx-note').value.trim(); if (!n && !shot && !confirm('Save without saying what happened? A few words helps Jerry fix it.')) return; sxAnswer(step, kind, n, shot); };
    if (!reopen) setTimeout(() => { const t = $('#sx-note'); if (t) t.focus(); }, 50);
  }

  function sxAnswer(step, kind, note, shot) {
    const st = sxState(); const now = Date.now();
    const prevAt = st.last; const first = !st.answers[step.id];
    const secs = prevAt ? Math.round((now - prevAt) / 1000) : null;
    st.answers[step.id] = { a: kind, note: note || '', shot: shot || null, at: new Date(now).toISOString(), secs };
    if (!st.first) st.first = new Date(now).toISOString();
    st.last = now; sxSave(st);
    const sess = liveSessions(SX.script).find((s) => s.steps.some((x) => x.id === step.id));
    sxQueue({ id: uuid(), tester: me.name, role: me.role, device, script_version: ((me.script ? me.script + '-' : '') + String(SX.script.version || '')).slice(0, 20), session: sess.id, step: step.id, answer: kind,
      note: note ? note.slice(0, 1000) : null, shot: shot || null, secs: secs == null ? null : Math.min(secs, 864000), session_secs: Math.min(sessSecsNow(sess.id), 864000), client_at: new Date(now).toISOString() });
    // ❌ and 🤷 notes also go where notes always went, so the old board, Daraja HQ and "read the testers' list" see them today.
    if (kind !== 'ok') log('note', ('sx:' + step.id).slice(0, 60), (ANS[kind][0] + ' ' + tokens(step.do).slice(0, 120) + ' — ' + (note || '(no words)') + (shot ? ' [screenshot on the board]' : '')).slice(0, 1000));
    if (first) toast(kind === 'ok' ? '✅ +1 coin' : 'Saved — thank you! +1 coin'); else toast('Answer changed.');
    sxPick = null; sxPlay(); window.scrollTo(0, 0);
  }

  // ---------- finished: the report ----------
  function sxSummary(st) {
    const live = liveSteps(SX.script); const n = (k) => live.filter((s) => st.answers[s.id] && st.answers[s.id].a === k).length;
    const mins = Math.round(Object.values(st.sessSecs || {}).reduce((t, x) => t + x, 0) / 60);
    let s = `📝 Test script report — ${WHO()} (script ${SX.script.version}) · ${me.name}\n${live.length} steps: ${n('ok')} ✅ · ${n('fail')} ❌ · ${n('unsure')} 🤷 · about ${mins} min`;
    live.filter((x) => st.answers[x.id] && st.answers[x.id].a !== 'ok').forEach((x) => { const a = st.answers[x.id]; s += `\n${ANS[a.a][0]} ${x.id} ${tokens(x.do).slice(0, 60)}… — ${a.note || '(no words)'}`; });
    return s.slice(0, 1000);
  }

  // like log(), but says whether the database refused the row (so the report can fall back to a note)
  async function logRow(kind, step, note) {
    const row = { tester: me.name, role: me.role, device, step, kind, note: note || null, version: VERSION };
    try { const { error } = await sb.from('tester_log').insert(row); if (error) { if (/check constraint|23514/i.test(error.message + (error.code || ''))) return 'rejected'; throw error; } return true; }
    catch (e) { const q = get('queue', []); q.push(row.kind === 'report' ? { ...row, kind: 'note', step: ('script:report:' + me.role).slice(0, 60) } : row); set('queue', q); return false; }
  }

    A.data.forEach((r) => { if (!ROLES[r.role]) return; const t = tester(r.tester, r.role); t.rows.push(r); const c = t.latest[r.step]; if (!c || c.client_at <= r.client_at) t.latest[r.step] = r; t.last = Math.max(t.last, Date.parse(r.client_at)); });
    log.forEach((r) => { if (!ROLES[r.role] || String(r.step).startsWith('auto:')) return; const t = tester(r.tester, r.role); t.logLast = Math.max(t.logLast, Date.parse(r.at));

    const weekKey = (t) => { const d = new Date(Date.parse(t) + 3 * 3600e3); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day); return d.toISOString().slice(0, 10); };
    const now = Date.now();
    const list = Object.values(T).map((t) => {

      const done = lat.length; const first = t.rows.length ? Math.min(...t.rows.map((r) => Date.parse(r.client_at))) : null;
      const finished = !!t.report && done === live.length && live.length > 0;
      const reds = lat.filter((r) => r.answer !== 'ok').map((r) => ({ ...r, conf: conf[who(t.name, t.role) + '|' + r.step] || null }));

        <div class="seg" style="margin-top:10px"><button type="button" id="p-all">Tick all</button><button type="button" id="p-none">Untick all</button></div></div>
      ${secs.map((sec) => `<h3><span>${esc(sec)}</span></h3><div class="card">${steps.filter((s) => s.sec === sec).map((s) => `<div class="row ${chosen.has(s.id) ? 'done' : ''}" data-id="${s.id}"><div class="chk">${chosen.has(s.id) ? '✓' : ''}</div><span class="t" style="text-decoration:none;color:var(--ink)">${esc(s.t)}</span></div>`).join('')}</div>`).join('')}
      <div class="card"><button class="big" id="p-save">Save this plan</button><p style="font-size:13px;color:var(--faint);margin:8px 0 0">${current ? 'Last saved ' + new Date(current.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + (current.by_who ? ' by ' + esc(current.by_who) : '') : 'No plan yet — they get every step.'}</p></div>`;
    const paint = () => $$('.row[data-id]').forEach((r) => { const on = chosen.has(r.dataset.id); r.classList.toggle('done', on); $('.chk', r).textContent = on ? '✓' : ''; });
    $$('.row[data-id]').forEach((r) => (r.onclick = () => { chosen.has(r.dataset.id) ? chosen.delete(r.dataset.id) : chosen.add(r.dataset.id); paint(); }));
    $('#p-all').onclick = () => { steps.forEach((s) => chosen.add(s.id)); paint(); };
    $('#p-none').onclick = () => { chosen.clear(); paint(); };
    $('#p-save').onclick = async () => {
      const ids = steps.map((s) => s.id).filter((id) => chosen.has(id));
      if (!ids.length) return toast('Tick at least one step.');
      const { error } = await ok.a.from('tester_plan').insert({ tester: who, role: who === '*' ? role : role, steps: ids.length === steps.length ? [] : ids, focus: $('#p-focus').value.trim() || null, by_who: ok.p.full_name || 'Jerry' });
      if (error) return toast('Could not save: ' + error.message);
      toast('Plan saved — their list updates next time they open it.'); setTimeout(() => (location.href = '?board'), 900);
    };
  }

  // ---------- start (after the invite code) ----------
  (window.ZG ? window.ZG.ready : Promise.resolve()).then(start);
  function start() {
  if (me && window.ZG) { const st = get('state', {}); window.ZG.report({ name: me.name, role: me.role, progress: Object.values(st).filter((v) => v === 'done').length + ' done' }); }
  if (new URLSearchParams(location.search).has('board')) board();
  else if (new URLSearchParams(location.search).has('plan')) planEditor();
  else if (!me) askWho();
  else {
    plan = get('plan', null);
    SX.script = get('sx_script_' + SID(), null); SX.reward = get('sx_reward', REWARD_DEFAULT); SX.confirmed = get('sx_confirmed', []);
    const scriptView = () => (SCRIPT_ONLY || get('intro_done', false)) && get('view', 'list') === 'script' && SX.script && !sxState().reported;
    if (scriptView()) sxPlay(); else render();
    // fresh script, rewards and plan from the server; the list repaints, the player only if it isn't mid-answer
    Promise.all([loadPlan(), loadScript(SID()).then((sc) => { SX.script = sc; }), loadRewards()]).then(() => { if ($('#sx-note')) { const c = $('#sx-coins'); if (c) { const k = myCoins(sxState()); c.textContent = '🪙 ' + k.coins + ' ≈ KES ' + k.kes.toLocaleString('en-GB'); } return; } if (scriptView()) sxPlay(); else render(); });
    if (!get('hello', false)) { log('hello', 'start').then(() => set('hello', true)); }
    flush(); sxFlush();
  }
  }
})();
</script>
</body>
</html>
